name: Apply pharmacist header update

on:
  push:
    branches:
      - pharmacist-header-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pharmacist page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pharmacist.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('id="logout" class="btn btn-light">Sign out</button>', 'id="logout" class="btn btn-light">Sign in</button>', 1)
          s = s.replace('<h1>Pharmacist Support</h1>', '<h1>Customer Support</h1>', 1)
          old = "$(\'#logout\').onclick=async()=>{await logoutStaff();location.reload()};"
          new = "$(\'#logout\').onclick=()=>{const login=$(\'#login\');if(login){login.scrollIntoView({behavior:\'smooth\',block:\'start\'});setTimeout(()=>$(\'#email\')?.focus(),450);}};"
          if old not in s:
              raise SystemExit('Expected logout handler was not found; refusing to patch.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-pharmacist-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pharmacist.html .github/workflows/patch-pharmacist-header.yml
          git commit -m "Update pharmacist support header" || exit 0
          git push
