name: Patch supplement product images

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace product image sources
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nutritional-supplements.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=900&q=80': '1000561597.webp',
            'https://images.unsplash.com/photo-1471864190281-a93a3070b6de?auto=format&fit=crop&w=900&q=80': '1000561610.webp',
            'https://images.unsplash.com/photo-1550572017-edd951aa8ca9?auto=format&fit=crop&w=900&q=80': '1000561598.webp',
            'https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=900&q=80': '1000561595.webp',
            'https://images.unsplash.com/photo-1580281658628-72f3e6b5fbb8?auto=format&fit=crop&w=900&q=80': '1000561598.webp',
            'https://images.unsplash.com/photo-1616671276441-2fbc7c8b8f4c?auto=format&fit=crop&w=900&q=80': '1000561610.webp',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected image source not found: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nutritional-supplements.html
          git commit -m 'Update nutritional supplement product images'
          git push
          git rm .github/workflows/patch-supplement-product-images.yml
          git commit -m 'Remove temporary product image patch workflow'
          git push
