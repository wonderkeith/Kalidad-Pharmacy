name: Apply mobile glass navigation

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '.github/workflows/apply-mobile-glass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply glass mobile navigation to root pages
        shell: python {0}
        run: |
          from pathlib import Path

          marker = 'KALIDAD MOBILE GLASS NAV v1'
          css = r'''<style id="kalidad-mobile-glass-nav-v1">
/* KALIDAD MOBILE GLASS NAV v1 */
@media (max-width: 900px){
  header{
    background:rgba(246,244,236,.72)!important;
    border-bottom:1px solid rgba(18,41,31,.14)!important;
    box-shadow:0 10px 30px rgba(18,41,31,.10)!important;
    -webkit-backdrop-filter:blur(18px) saturate(145%)!important;
    backdrop-filter:blur(18px) saturate(145%)!important;
  }
  .menu-toggle,.menu{
    display:flex!important;align-items:center!important;justify-content:center!important;
    width:46px!important;height:46px!important;border:1.5px solid rgba(30,79,59,.55)!important;
    border-radius:14px!important;background:rgba(246,244,236,.42)!important;
    color:var(--forest,#1E4F3B)!important;box-shadow:0 8px 24px rgba(18,41,31,.10)!important;
    -webkit-backdrop-filter:blur(14px) saturate(150%)!important;backdrop-filter:blur(14px) saturate(150%)!important;
  }
  .menu-toggle:hover,.menu:hover,.menu-toggle:focus-visible,.menu:focus-visible{
    background:rgba(246,244,236,.64)!important;border-color:rgba(30,79,59,.75)!important;
    box-shadow:0 12px 28px rgba(18,41,31,.14)!important;outline:none!important;
  }
  .mobile-menu{
    background:rgba(246,244,236,.68)!important;border-top:1px solid rgba(18,41,31,.12)!important;
    border-bottom:1px solid rgba(18,41,31,.10)!important;box-shadow:0 18px 40px rgba(18,41,31,.13)!important;
    -webkit-backdrop-filter:blur(22px) saturate(145%)!important;backdrop-filter:blur(22px) saturate(145%)!important;
  }
  .mobile-menu a{
    color:var(--forest,#1E4F3B)!important;background:transparent!important;border:1px solid transparent!important;
  }
  .mobile-menu a:hover,.mobile-menu a:focus-visible,.mobile-menu a.active{
    color:var(--accent-fg,#33581F)!important;background:rgba(230,243,217,.72)!important;
    border-color:rgba(51,88,31,.10)!important;outline:none!important;
  }
}
@media (prefers-reduced-motion: reduce){.menu-toggle,.menu,.mobile-menu,.mobile-menu a{transition:none!important;}}
</style>'''

          changed=[]
          for path in sorted(Path('.').glob('*.html')):
              text=path.read_text(encoding='utf-8')
              if marker in text: continue
              if '</head>' not in text.lower(): continue
              if 'menu-toggle' not in text and 'class="menu"' not in text and "class='menu'" not in text: continue
              pos=text.lower().rfind('</body>')
              if pos>=0: text=text[:pos]+'\n'+css+'\n'+text[pos:]
              else: text+='\n'+css+'\n'
              path.write_text(text,encoding='utf-8'); changed.append(path.name)
          print('Updated:',', '.join(changed) if changed else 'none')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then echo "No navigation changes needed."; exit 0; fi
          git commit -m "Unify mobile navigation glass styling"
          git push
