name: Rework News and About Heroes
on:
  push:
    branches: [fix/news-about-hero]
permissions:
  contents: write
jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply page-specific hero treatment
        shell: python
        run: |
          from pathlib import Path
          def patch(path, css, marker, cls):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if marker not in s:
                  s=s.replace('</head>', f'<style id="{marker}">\n{css}\n</style>\n</head>', 1)
              if cls not in s:
                  s=s.replace('<div class="page-banner"', f'<div class="page-banner {cls}"', 1)
              p.write_text(s,encoding='utf-8')
          css=r''' .page-banner.news-hero-reworked,.page-banner.about-hero-reworked{position:relative!important;width:100%!important;height:100svh!important;min-height:100svh!important;margin:0!important;padding:0!important;overflow:hidden!important;display:flex!important;align-items:center!important;background-size:cover!important;background-repeat:no-repeat!important;background-color:#12291F!important}.page-banner.news-hero-reworked{background-image:url('pharmacist_green_scrubs.webp')!important;background-position:center 38%!important}.page-banner.about-hero-reworked{background-image:url('20260724_151100(1)_HD.webp')!important;background-position:center 32%!important}.page-banner.news-hero-reworked::before,.page-banner.about-hero-reworked::before{content:""!important;position:absolute!important;inset:0!important;z-index:1!important;pointer-events:none!important;background:linear-gradient(90deg,rgba(18,41,31,.82) 0%,rgba(18,41,31,.57) 28%,rgba(18,41,31,.18) 60%,rgba(18,41,31,.04) 100%)!important}.page-banner.news-hero-reworked::after,.page-banner.about-hero-reworked::after{display:none!important;content:none!important}.page-banner.news-hero-reworked .container,.page-banner.about-hero-reworked .container{position:relative!important;z-index:3!important;width:100%!important;max-width:none!important;height:100%!important;min-height:100svh!important;margin:0!important;padding:0 7vw!important;display:flex!important;align-items:center!important}.page-banner.news-hero-reworked .hero-copy,.page-banner.about-hero-reworked .hero-copy{position:relative!important;z-index:4!important;width:min(680px,72vw)!important;max-width:680px!important;margin:0!important;padding:0!important}.page-banner.news-hero-reworked h1,.page-banner.about-hero-reworked h1{color:#fff!important;text-shadow:0 3px 22px rgba(0,0,0,.42)!important}.page-banner.news-hero-reworked h1 .accent,.page-banner.about-hero-reworked h1 .accent{color:#C7EF3E!important}.page-banner.news-hero-reworked .kicker,.page-banner.about-hero-reworked .kicker{color:#C7EF3E!important}.page-banner.news-hero-reworked p,.page-banner.about-hero-reworked p{color:rgba(255,255,255,.96)!important;opacity:1!important;text-shadow:0 1px 12px rgba(0,0,0,.3)!important}.page-banner.news-hero-reworked .breadcrumb,.page-banner.about-hero-reworked .breadcrumb{color:rgba(255,255,255,.82)!important}@media(max-width:900px){.page-banner.news-hero-reworked,.page-banner.about-hero-reworked{height:100svh!important;min-height:100svh!important;background-position:62% center!important}.page-banner.about-hero-reworked{background-position:58% center!important}.page-banner.news-hero-reworked .container,.page-banner.about-hero-reworked .container{padding:0 28px!important}.page-banner.news-hero-reworked .hero-copy,.page-banner.about-hero-reworked .hero-copy{width:72%!important;max-width:360px!important;transform:translateY(8%)!important}.page-banner.news-hero-reworked::before,.page-banner.about-hero-reworked::before{background:linear-gradient(90deg,rgba(18,41,31,.78) 0%,rgba(18,41,31,.5) 48%,rgba(18,41,31,.12) 100%)!important}}@media(max-width:560px){.page-banner.news-hero-reworked .container,.page-banner.about-hero-reworked .container{padding:0 22px!important}.page-banner.news-hero-reworked .hero-copy,.page-banner.about-hero-reworked .hero-copy{width:74%!important;max-width:275px!important}} '''
          patch('news.html',css,'kalidad-news-hero-rework','news-hero-reworked')
          patch('about.html',css,'kalidad-about-hero-rework','about-hero-reworked')
      - name: Validate exactly two production files
        shell: bash
        run: |
          grep -q 'kalidad-news-hero-rework' news.html
          grep -q 'kalidad-about-hero-rework' about.html
          files=$(git diff --name-only | grep -v '^.github/workflows/rework-news-about-hero.yml$' | sort | tr '\n' ' ')
          test "$files" = 'about.html news.html '
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/rework-news-about-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.html about.html .github/workflows/rework-news-about-hero.yml
          git commit -m "Rework news and about heroes"
          git push origin HEAD
