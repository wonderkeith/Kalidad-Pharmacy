name: Repair four OTC-style hero pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact OTC Wellness hero treatment
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          CSS = '''<style id="final-otc-hero-match">
          /* FINAL OTC WELLNESS HERO MATCH — exact overlay and text treatment */
          .catalog-page-hero.otc-hero-match{min-height:600px!important;position:relative!important;overflow:hidden!important;background:#12291F!important}
          .catalog-page-hero.otc-hero-match .hero-bg{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:0!important}
          .catalog-page-hero.otc-hero-match .hero-bg img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important}
          .catalog-page-hero.otc-hero-match .hero-bg::after{content:""!important;position:absolute!important;inset:0!important;display:block!important;background:linear-gradient(90deg,rgba(18,41,31,.68) 0%,rgba(18,41,31,.45) 28%,rgba(18,41,31,.12) 58%,rgba(18,41,31,.02) 100%)!important;z-index:1!important;pointer-events:none!important}
          .catalog-page-hero.otc-hero-match .hero-copy{position:relative!important;z-index:2!important;min-height:600px!important;max-width:1180px!important;margin:0 auto!important;padding:120px 24px 80px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:flex-start!important;opacity:1!important;transform:none!important}
          .catalog-page-hero.otc-hero-match h1{color:#fff!important}
          .catalog-page-hero.otc-hero-match h1 .accent{color:var(--lime)!important}
          .catalog-page-hero.otc-hero-match .btn-outline{border-color:#fff!important;color:#fff!important;background:rgba(18,41,31,.12)!important}
          @media(max-width:850px){.catalog-page-hero.otc-hero-match .hero-bg::after{background:linear-gradient(90deg,rgba(18,41,31,.66) 0%,rgba(18,41,31,.36) 55%,rgba(18,41,31,.12) 100%)!important}}
          </style>'''

          pages = [
              'nutritional-supplements.html',
              'personal-hygiene-oral-care.html',
              'skincare-body-care.html',
              'baby-care.html',
          ]

          style_re = re.compile(r'<style id="final-otc-hero-match">.*?</style>', re.S)
          hero_re = re.compile(r'(<(?:section|div)\b[^>]*\bclass=["\'])([^"\']*\bcatalog-page-hero\b[^"\']*)(["\'])>', re.I)

          for name in pages:
              p = Path(name)
              original = p.read_text(encoding='utf-8')
              m = hero_re.search(original)
              if not m:
                  raise SystemExit(f'Catalog hero markup not found in {name}')
              classes = m.group(2).split()
              if 'otc-hero-match' not in classes:
                  classes.append('otc-hero-match')
              tag = m.group(1) + ' '.join(classes) + m.group(3) + '>'
              html = original[:m.start()] + tag + original[m.end():]
              if style_re.search(html):
                  html = style_re.sub(CSS, html, count=1)
              else:
                  html = html.replace('</head>', CSS + '\n</head>', 1)
              p.write_text(html, encoding='utf-8')
              print(f'Patched {name}: OTC catalog hero installed')

          print('FOUR CATALOG HERO PAGES PATCHED.')
          PY

      - name: Verify
        shell: bash
        run: |
          set -e
          for f in nutritional-supplements.html personal-hygiene-oral-care.html skincare-body-care.html baby-care.html; do
            grep -q 'catalog-page-hero otc-hero-match' "$f"
            grep -q 'final-otc-hero-match' "$f"
            grep -q 'rgba(18,41,31,.68)' "$f"
            grep -q 'h1 .accent' "$f"
          done
          echo 'Verified all four catalog hero pages.'

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutritional-supplements.html personal-hygiene-oral-care.html skincare-body-care.html baby-care.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m "Fix OTC hero treatment on four catalog pages"
          git push
