name: Refine About Hero Mobile Position
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    if: github.event.head_commit.message != 'Refine About hero mobile position'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine position
        shell: python
        run: |
          from pathlib import Path
          p=Path('about.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('top:51% !important;','top:57% !important;')
          s=s.replace('top:52% !important;','top:57% !important;')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git diff --cached --quiet || git commit -m "Refine About hero mobile position"
          git push
      - name: Remove workflow
        if: always()
        run: |
          git rm .github/workflows/refine-about-hero-mobile-position.yml || true
          git commit -m "Remove temporary About hero refinement workflow" || true
          git push || true
