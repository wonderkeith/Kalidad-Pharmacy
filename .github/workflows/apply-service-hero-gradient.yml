name: Apply OTC Wellness Hero Gradient

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-gradient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply OTC wellness hero gradient and text colors
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              'nutritional-supplements.html',
              'personal-hygiene-oral-care.html',
              'skincare-body-care.html',
              'baby-care.html',
              'health-checks.html',
              'prescription-filling.html',
          ]

          override = '''\n<style id="otc-wellness-hero-gradient-match">\n/* Match the OTC Wellness hero treatment across service pages.\n   Source gradient: otc-wellness.html .wellness-parent-hero image overlay. */\n.service-detail-hero .service-detail-image::after {\n  content: "";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(90deg,rgba(18,41,31,.68) 0%,rgba(18,41,31,.45) 28%,rgba(18,41,31,.12) 58%,rgba(18,41,31,.02) 100%);\n  pointer-events: none;\n  z-index: 1;\n}\n.service-detail-hero .service-detail-copy {\n  position: relative;\n  z-index: 2;\n}\n.service-detail-hero .service-detail-copy h1,\n.service-detail-hero .service-detail-copy h1:not(.accent) {\n  color: #fff !important;\n}\n.service-detail-hero .service-detail-copy h1 .accent,\n.service-detail-hero .service-detail-copy .accent {\n  color: var(--lime) !important;\n}\n</style>\n'''

          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\n<style id="otc-wellness-hero-gradient-match">[\\s\\S]*?</style>\n?', '\n', text)
              if '</head>' not in text:
                  raise SystemExit(f'Could not find </head> in {name}')
              text = text.replace('</head>', override + '</head>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit service hero updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutritional-supplements.html personal-hygiene-oral-care.html skincare-body-care.html baby-care.html health-checks.html prescription-filling.html
          git commit -m "Match OTC wellness gradient across service heroes"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-service-hero-gradient.yml
          git commit -m "Remove temporary service hero workflow"
          git push
