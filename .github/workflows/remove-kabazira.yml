name: Remove Kabazira from About Team

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-kabazira:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove Kabazira Daphine
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('about-team-slider.js')
          text = path.read_text(encoding='utf-8')
          pattern = r"\n\s*\{ name: 'Kabazira Daphine',.*?\},"
          updated, count = re.subn(pattern, '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Kabazira Daphine entry not found.')
          path.write_text(updated, encoding='utf-8')

      - name: Commit team update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about-team-slider.js
          git commit -m "Remove Kabazira Daphine from About team"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/remove-kabazira.yml
          git commit -m "Remove temporary Kabazira workflow"
          git push
