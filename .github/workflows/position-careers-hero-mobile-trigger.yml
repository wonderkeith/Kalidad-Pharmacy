name: Trigger Careers Hero Positioning

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Trigger careers hero positioning"
          git push
      - name: Remove trigger workflow
        shell: bash
        run: |
          git rm .github/workflows/position-careers-hero-mobile-trigger.yml
          git commit -m "Remove careers hero trigger workflow"
          git push
