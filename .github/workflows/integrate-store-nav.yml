name: Integrate Kalidad Store Navigation

on:
  push:
    branches:
      - feature/firebase-store-final

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate store navigation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Store and Account navigation
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'store', 'admin', '.git'}
          files_changed = []

          desktop = '''\n                <a href="store/index.html" class="nav-link nav-store-link" data-kalidad-store-link>Shop Online</a>\n                <a href="store/login.html" class="nav-link nav-account-link" data-kalidad-account-link>My Account</a>'''
          mobile = '''\n            <a href="store/index.html" class="nav-store-mobile" data-kalidad-store-link>Shop Online</a>\n            <a href="store/login.html" class="nav-account-mobile" data-kalidad-account-link>My Account</a>'''

          css = '''\n<style id="kalidad-store-navigation">\n.nav-store-link,.nav-account-link{font-weight:800!important;}\n.nav-store-link{background:var(--forest)!important;color:#fff!important;box-shadow:0 8px 20px rgba(18,41,31,.14);}\n.nav-store-link:hover,.nav-store-link:focus-visible{background:var(--lime)!important;color:var(--forest-deep)!important;}\n.nav-account-link{border:1px solid var(--forest)!important;}\n.nav-account-link:hover,.nav-account-link:focus-visible{background:var(--accent-bg)!important;}\n.nav-store-mobile,.nav-account-mobile{display:block!important;font-weight:800!important;}\n.nav-store-mobile{background:var(--forest);color:#fff!important;margin-top:4px;}\n.nav-account-mobile{border:1px solid var(--forest);margin-bottom:4px;}\n@media(max-width:900px){.nav-store-mobile{color:#fff!important;}}\nhtml[data-theme="dark"] .nav-store-link{background:#c7ef3e!important;color:#12291F!important;}\nhtml[data-theme="dark"] .nav-account-link{border-color:#c7ef3e!important;color:#fff!important;}\n</style>\n'''

          for path in root.rglob('*.html'):
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              original = text
              if 'data-kalidad-store-link' in text:
                  continue

              if '<nav class="main-nav"' in text:
                  if '<span class="open-badge"' in text:
                      text = text.replace('<span class="open-badge"', desktop + '\n                <span class="open-badge"', 1)
                  else:
                      text = text.replace('</nav>', desktop + '\n            </nav>', 1)

              if 'class="mobile-menu"' in text:
                  text = text.replace('</div>\n    </header>', mobile + '\n        </div>\n    </header>', 1)

              if text != original and 'id="kalidad-store-navigation"' not in text:
                  text = text.replace('</head>', css + '\n</head>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  files_changed.append(str(path))

          print('Updated:', len(files_changed), 'HTML files')
          for f in files_changed:
              print(' -', f)

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrate store navigation"
          git push
