name: Fix News About Hero Selectors
on:
  push:
    branches: [fix/news-about-hero]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply direct page-scoped hero override
        shell: python
        run: |
          from pathlib import Path
          css=r'''
          .page-banner{position:relative!important;width:100%!important;height:100svh!important;min-height:100svh!important;margin:0!important;padding:0!important;overflow:hidden!important;display:flex!important;align-items:center!important;background-size:cover!important;background-repeat:no-repeat!important;background-color:#12291F!important}
          .page-banner::before{content:""!important;position:absolute!important;inset:0!important;z-index:1!important;pointer-events:none!important;background:linear-gradient(90deg,rgba(18,41,31,.82) 0%,rgba(18,41,31,.57) 28%,rgba(18,41,31,.18) 60%,rgba(18,41,31,.04) 100%)!important}
          .page-banner::after{display:none!important;content:none!important}
          .page-banner .container{position:relative!important;z-index:3!important;width:100%!important;max-width:none!important;height:100%!important;min-height:100svh!important;margin:0!important;padding:0 7vw!important;display:flex!important;align-items:center!important}
          .page-banner h1{color:#fff!important;text-shadow:0 3px 22px rgba(0,0,0,.42)!important}
          .page-banner h1 .accent{color:#C7EF3E!important}
          .page-banner .kicker{color:#C7EF3E!important}
          .page-banner p{color:rgba(255,255,255,.96)!important;opacity:1!important;text-shadow:0 1px 12px rgba(0,0,0,.3)!important}
          .page-banner .breadcrumb{color:rgba(255,255,255,.82)!important}
          @media(max-width:900px){.page-banner{height:100svh!important;min-height:100svh!important}.page-banner .container{padding:0 28px!important}.page-banner .hero-copy{width:72%!important;max-width:360px!important;transform:translateY(8%)!important}.page-banner::before{background:linear-gradient(90deg,rgba(18,41,31,.78) 0%,rgba(18,41,31,.5) 48%,rgba(18,41,31,.12) 100%)!important}}
          @media(max-width:560px){.page-banner .container{padding:0 22px!important}.page-banner .hero-copy{width:74%!important;max-width:275px!important}}
          '''
          for name, image, marker in [('news.html','pharmacist_green_scrubs.webp','kalidad-news-direct-hero'),('about.html','20260724_151100(1)_HD.webp','kalidad-about-direct-hero')]:
              p=Path(name); s=p.read_text(encoding='utf-8')
              if marker not in s:
                  pagecss=css.replace('background-size:cover!important;',f'background-image:url(\'{image}\')!important;background-size:cover!important;',1)
                  s=s.replace('</head>',f'<style id="{marker}">\n{pagecss}\n</style>\n</head>',1)
                  p.write_text(s,encoding='utf-8')
      - name: Validate production scope and markers
        shell: bash
        run: |
          grep -q 'kalidad-news-direct-hero' news.html
          grep -q 'kalidad-about-direct-hero' about.html
          files=$(git diff --name-only | sort | tr '\n' ' ')
          test "$files" = 'about.html news.html '
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-news-about-selector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.html about.html .github/workflows/fix-news-about-selector.yml
          git commit -m "Fix news and about hero rendering"
          git push origin HEAD
