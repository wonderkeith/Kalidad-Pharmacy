name: Refine customer pharmacist chat states
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-customer-live-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch guided chatbot
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('chatbot.js')
          s=p.read_text()
          s=s.replace("var shown = {};", "var shown = {};\n  var pharmacistConnected = false;")
          s=s.replace("var closed = state === 'closed' || state === 'resolved';\n      var live = waiting || active;\n      MODE.textContent = state === 'active' ? 'Live pharmacist' : state === 'waiting' ? 'Waiting for pharmacist' : closed ? 'Chat closed' : 'Choose a service';", "var closed = state === 'closed' || state === 'resolved';\n      var live = waiting || active;\n      MODE.textContent = state === 'active' ? 'Pharmacist connected' : state === 'waiting' ? 'Waiting for pharmacist' : closed ? 'Chat closed' : 'Choose a service';")
          s=s.replace("say('This pharmacist conversation has ended. You can start a new pharmacist chat if you need further help.', 'system');", "say('This pharmacist conversation has ended. You can start a new chat if you need further help.', 'system');")
          s=s.replace("<button class=\"primary\" id=\"kcNewLive\" type=\"button\" style=\"display:none\">Start a new conversation</button>", "<button class=\"primary\" id=\"kcNewLive\" type=\"button\" style=\"display:none\">Start new chat</button>")
          s=s.replace("if (!shown[message.id] && message.senderType === 'staff') {\n                shown[message.id] = true;\n                say(message.body, 'bot');", "if (!shown[message.id] && message.senderType === 'staff') {\n                shown[message.id] = true;\n                pharmacistConnected = true;\n                setLiveUi('active');\n                say(message.body, 'bot');")
          s=s.replace("if (conversation.status === 'active') setLiveUi('active');", "if (conversation.status === 'active') { pharmacistConnected = true; setLiveUi('active'); }")
          s=s.replace("else if (conversation.status === 'waiting') setLiveUi('waiting');", "else if (conversation.status === 'waiting') { if (!pharmacistConnected) setLiveUi('waiting'); }")
          s=s.replace("async function closeLive() {\n      if (!liveId) return;\n      if (!window.confirm('Close this pharmacist conversation?')) return;\n      try {", "async function closeLive() {\n      if (!liveId) return;\n      try {")
          s=s.replace("await f.closeCustomerConversation(liveId);\n      } catch (error) {", "await f.closeCustomerConversation(liveId);\n        pharmacistConnected = false;\n        setLiveUi('closed');\n        try { sessionStorage.removeItem('kalidad_live_chat_id'); } catch (_) {}\n      } catch (error) {")
          s=s.replace("liveId = null;\n      history = [];", "liveId = null;\n      pharmacistConnected = false;\n      history = [];")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatbot.js
          git commit -m "Show pharmacist connected state and restore chat controls" || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-customer-live-ui.yml || true
          git commit -m "Remove temporary chatbot UI patch workflow" || exit 0
          git push
