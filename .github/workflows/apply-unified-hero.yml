name: Apply unified hero treatment

on:
  push:
    branches:
      - fix/unified-hero-treatment

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hero treatment
        run: python scripts/apply-unified-hero.py
      - name: Validate HTML files
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
            'index.html','services.html','contact.html','careers.html','news.html','about.html',
            'simple-health-habits.html','understanding-prescriptions.html','everyday-wellness-habits.html',
            'routine-health-checks.html','medicine-routine-reminders.html','kalidad-pharmacy-community.html',
            'healthier-meals-one-choice.html'
          ]
          for page in pages:
              s=Path(page).read_text(encoding='utf-8')
              assert 'kalidad-unified-hero' in s, page
              assert s.count('Kalidad unified full-screen hero treatment') == 1, page
              assert '</head>' in s and '</body>' in s, page
          print('Validated', len(pages), 'pages')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html contact.html careers.html news.html about.html simple-health-habits.html understanding-prescriptions.html everyday-wellness-habits.html routine-health-checks.html medicine-routine-reminders.html kalidad-pharmacy-community.html healthier-meals-one-choice.html
          git commit -m "Apply unified full-screen hero treatment" || exit 0
          git push
