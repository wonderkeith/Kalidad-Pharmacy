name: Apply OTC hero treatment to service pages

on:
  push:
    paths:
      - '.github/workflows/apply-otc-hero-treatment.yml'
      - 'nutritional-supplements.html'
      - 'personal-hygiene-oral-care.html'
      - 'skincare-body-care.html'
      - 'baby-care.html'
      - 'health-checks.html'
      - 'prescription-filling.html'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact OTC Wellness hero treatment
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              'nutritional-supplements.html',
              'personal-hygiene-oral-care.html',
              'skincare-body-care.html',
              'baby-care.html',
              'health-checks.html',
              'prescription-filling.html',
          ]

          exact_desktop = 'linear-gradient(90deg,rgba(18,41,31,.68) 0%,rgba(18,41,31,.45) 28%,rgba(18,41,31,.12) 58%,rgba(18,41,31,.02) 100%)'
          exact_mobile = 'linear-gradient(90deg,rgba(18,41,31,.66) 0%,rgba(18,41,31,.36) 55%,rgba(18,41,31,.12) 100%)'

          catalog_block = f'''\n<style id="otc-wellness-hero-gradient-match">\n/* Exact OTC Wellness hero treatment. */\n.catalog-page-hero .hero-bg::after {{\n  background: {exact_desktop} !important;\n}}\n.catalog-page-hero h1 {{\n  color: #fff !important;\n}}\n.catalog-page-hero h1 .accent {{\n  color: var(--lime) !important;\n}}\n@media (max-width:850px) {{\n  .catalog-page-hero .hero-bg::after {{\n    background: {exact_mobile} !important;\n  }}\n}}\n</style>\n'''

          detail_block = f'''\n<style id="otc-wellness-hero-gradient-match">\n/* Exact OTC Wellness hero treatment applied as a full-image service hero. */\n.service-detail-hero {{\n  position: relative !important;\n  display: block !important;\n  min-height: 650px !important;\n  overflow: hidden !important;\n  background: var(--forest-deep) !important;\n}}\n.service-detail-image {{\n  position: absolute !important;\n  inset: 0 !important;\n  width: 100% !important;\n  height: 100% !important;\n  min-height: 100% !important;\n  z-index: 0 !important;\n}}\n.service-detail-image::after {{\n  content: "" !important;\n  position: absolute !important;\n  inset: 0 !important;\n  background: {exact_desktop} !important;\n  z-index: 1 !important;\n  pointer-events: none !important;\n}}\n.service-detail-image img {{\n  width: 100% !important;\n  height: 100% !important;\n  object-fit: cover !important;\n}}\n.service-detail-copy {{\n  position: relative !important;\n  z-index: 2 !important;\n  width: 100% !important;\n  max-width: 1180px !important;\n  min-height: 650px !important;\n  margin: 0 auto !important;\n  padding: 120px 24px 90px !important;\n  display: flex !important;\n  flex-direction: column !important;\n  justify-content: center !important;\n}}\n.service-detail-copy h1 {{\n  max-width: 760px !important;\n  color: #fff !important;\n}}\n.service-detail-copy h1 .accent {{\n  color: var(--lime) !important;\n}}\n.service-detail-copy .lead {{\n  max-width: 620px !important;\n  color: rgba(255,255,255,.90) !important;\n}}\n.service-detail-actions .btn-outline {{\n  border-color: #fff !important;\n  color: #fff !important;\n  background: rgba(18,41,31,.12) !important;\n}}\n@media (max-width:850px) {{\n  .service-detail-hero {{\n    min-height: 570px !important;\n  }}\n  .service-detail-image {{\n    height: 570px !important;\n    min-height: 570px !important;\n  }}\n  .service-detail-image::after {{\n    background: {exact_mobile} !important;\n  }}\n  .service-detail-copy {{\n    min-height: 570px !important;\n    padding: 105px 24px 70px !important;\n  }}\n  .service-detail-copy h1 {{\n    font-size: clamp(2.8rem,13vw,4.6rem) !important;\n  }}\n}}\n</style>\n'''

          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')

              # Remove every previous generated hero override, then insert exactly one.
              text = re.sub(r'\s*<style id="otc-wellness-hero-gradient-match">.*?</style>\s*', '\n', text, flags=re.S)

              # Catalog pages already use the OTC-style full-image hero structure.
              # Service detail pages are converted to the same full-image/overlay treatment.
              if '.service-detail-hero' in text and 'class="service-detail-hero"' in text:
                  block = detail_block
              else:
                  block = catalog_block

              text = text.replace('</head>', block + '</head>', 1)
              p.write_text(text, encoding='utf-8')

          print('Applied exact OTC hero treatment to all six service pages.')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nutritional-supplements.html personal-hygiene-oral-care.html skincare-body-care.html baby-care.html health-checks.html prescription-filling.html
          git diff --cached --quiet || git commit -m "Match all service heroes to OTC Wellness treatment"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-otc-hero-treatment.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Remove temporary hero treatment workflow" || true
          git push || true
