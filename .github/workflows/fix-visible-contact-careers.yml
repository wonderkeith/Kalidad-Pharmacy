name: Repair Contact and Careers Heroes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-heroes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair contact and careers hero rendering
        shell: python
        run: |
          from pathlib import Path

          contact = Path('contact.html')
          text = contact.read_text(encoding='utf-8')
          marker = 'final-contact-hero-visibility'
          css = '''<style id="final-contact-hero-visibility">
          .page-banner.kalidad-unified-hero{position:relative!important;width:100%!important;height:100svh!important;min-height:100svh!important;margin:0!important;padding:0!important;overflow:hidden!important;display:block!important;background-image:url('20260724_151100(1)_HD.webp')!important;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;background-color:#12291F!important}
          .page-banner.kalidad-unified-hero::before{content:""!important;position:absolute!important;inset:0!important;z-index:1!important;background:linear-gradient(90deg,rgba(18,41,31,.82) 0%,rgba(18,41,31,.58) 27%,rgba(18,41,31,.18) 58%,rgba(18,41,31,.04) 100%)!important;pointer-events:none!important}
          .page-banner.kalidad-unified-hero::after{display:none!important}
          .page-banner.kalidad-unified-hero .container{position:relative!important;z-index:3!important;width:100%!important;max-width:none!important;height:100%!important;min-height:100svh!important;margin:0!important;padding:0 7vw!important;display:flex!important;align-items:center!important;box-sizing:border-box!important}
          .page-banner.kalidad-unified-hero .hero-copy{position:relative!important;z-index:4!important;width:min(680px,72vw)!important;max-width:680px!important;height:auto!important;min-height:0!important;padding:0!important;margin:0!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:flex-start!important}
          .page-banner.kalidad-unified-hero h1,.page-banner.kalidad-unified-hero h1 .line-dark{color:#fff!important;text-shadow:0 3px 22px rgba(0,0,0,.42)!important}
          .page-banner.kalidad-unified-hero h1 .line-lime,.page-banner.kalidad-unified-hero h1 .accent{color:#C7EF3E!important}
          @media(max-width:900px){.page-banner.kalidad-unified-hero{height:100svh!important;min-height:100svh!important;background-position:64% center!important}.page-banner.kalidad-unified-hero .container{padding:0 28px!important}.page-banner.kalidad-unified-hero .hero-copy{width:70%!important;max-width:360px!important;transform:translateY(8%)!important}}
          @media(max-width:560px){.page-banner.kalidad-unified-hero{background-position:62% center!important}.page-banner.kalidad-unified-hero .container{padding:0 22px!important}.page-banner.kalidad-unified-hero .hero-copy{width:72%!important;max-width:260px!important}}
          </style>'''
          if marker not in text:
              text = text.replace('</head>', css + '\n</head>', 1)
              contact.write_text(text, encoding='utf-8')

          careers = Path('careers.html')
          text = careers.read_text(encoding='utf-8')
          marker = 'final-careers-hero-visibility'
          css = '''<style id="final-careers-hero-visibility">
          .careers-page .reference-career-hero{position:relative!important;width:100%!important;height:100svh!important;min-height:100svh!important;margin:0!important;overflow:hidden!important;background:#12291F!important}
          .careers-page .reference-career-hero .career-hero-image{position:absolute!important;inset:0!important;display:block!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;max-width:none!important;object-fit:cover!important;object-position:center!important;z-index:0!important}
          .careers-page .reference-career-hero::after{content:""!important;position:absolute!important;inset:0!important;z-index:1!important;pointer-events:none!important;background:linear-gradient(90deg,rgba(18,41,31,.72) 0%,rgba(18,41,31,.42) 35%,rgba(18,41,31,.08) 68%,rgba(18,41,31,.02) 100%)!important}
          .careers-page .reference-career-inner{position:relative!important;z-index:3!important;width:100%!important;height:100%!important;min-height:100svh!important;max-width:none!important;margin:0!important;padding:0 7vw!important;display:flex!important;align-items:center!important;box-sizing:border-box!important}
          .careers-page .reference-career-copy{grid-column:auto!important;max-width:620px!important}
          .careers-page .reference-career-copy h1{color:#fff!important;text-shadow:0 3px 22px rgba(0,0,0,.42)!important}
          .careers-page .reference-career-copy h1 span{color:#C7EF3E!important}
          @media(max-width:900px){.careers-page .reference-career-hero{height:100svh!important;min-height:100svh!important}.careers-page .reference-career-hero .career-hero-image{object-position:58% center!important}.careers-page .reference-career-inner{min-height:100svh!important;padding:0 28px!important}.careers-page .reference-career-copy{width:70%!important;max-width:360px!important;transform:translateY(8%)!important}}
          @media(max-width:560px){.careers-page .reference-career-inner{padding:0 22px!important}.careers-page .reference-career-copy{width:72%!important;max-width:270px!important}}
          </style>'''
          if marker not in text:
              text = text.replace('</head>', css + '\n</head>', 1)
              careers.write_text(text, encoding='utf-8')

          print('Contact and careers hero repair prepared.')

      - name: Validate only intended production files changed
        shell: bash
        run: |
          grep -q 'final-contact-hero-visibility' contact.html
          grep -q 'final-careers-hero-visibility' careers.html
          git diff --name-only | grep -vE '^(contact.html|careers.html|.github/workflows/fix-visible-contact-careers.yml)$' && exit 1 || true

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/fix-visible-contact-careers.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact.html careers.html .github/workflows/fix-visible-contact-careers.yml
          git commit -m "Fix visible contact and careers heroes"
          git push
