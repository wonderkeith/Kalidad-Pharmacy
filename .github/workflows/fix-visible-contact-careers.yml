name: Hero visibility repair
on: push
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 - <<'PY'
          from pathlib import Path
          c=Path('contact.html'); s=c.read_text(); marker='FINAL CONTACT HERO VISIBILITY REPAIR'
          css='''<style id="final-contact-hero-visibility">.page-banner.kalidad-unified-hero{height:100svh!important;min-height:100svh!important;padding:0!important;background-image:url(\'20260724_151100(1)_HD.webp\')!important;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;display:block!important}.page-banner.kalidad-unified-hero::before{content:""!important;position:absolute!important;inset:0!important;background:linear-gradient(90deg,rgba(18,41,31,.82),rgba(18,41,31,.18) 60%,rgba(18,41,31,.04))!important;z-index:1!important}.page-banner.kalidad-unified-hero .container{position:relative!important;z-index:3!important;height:100%!important;min-height:100svh!important;display:flex!important;align-items:center!important;padding:0 7vw!important}.page-banner.kalidad-unified-hero .hero-copy{position:relative!important;z-index:4!important;width:min(680px,72vw)!important;height:auto!important;min-height:0!important;padding:0!important}.page-banner.kalidad-unified-hero h1,.page-banner.kalidad-unified-hero h1 .line-dark{color:#fff!important;text-shadow:0 3px 22px rgba(0,0,0,.42)!important}.page-banner.kalidad-unified-hero h1 .line-lime,.page-banner.kalidad-unified-hero h1 .accent{color:#C7EF3E!important}@media(max-width:900px){.page-banner.kalidad-unified-hero{height:100svh!important;min-height:100svh!important;background-position:64% center!important}.page-banner.kalidad-unified-hero .container{padding:0 28px!important}.page-banner.kalidad-unified-hero .hero-copy{width:70%!important;max-width:360px!important;transform:translateY(8%)!important}}</style>'''
          if marker not in s: c.write_text(s.replace('</head>',css.replace('final-contact-hero-visibility',marker.lower())+'</head>'))
          p=Path('careers.html'); s=p.read_text(); marker2='FINAL CAREERS HERO VISIBILITY REPAIR'
          css2='''<style id="final-careers-hero-visibility">.careers-page .reference-career-hero{height:100svh!important;min-height:100svh!important;position:relative!important;overflow:hidden!important}.careers-page .reference-career-hero .career-hero-image{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;object-fit:cover!important;object-position:center!important;z-index:0!important}.careers-page .reference-career-hero::after{content:""!important;position:absolute!important;inset:0!important;z-index:1!important;background:linear-gradient(90deg,rgba(18,41,31,.72),rgba(18,41,31,.10) 70%,rgba(18,41,31,.02))!important}.careers-page .reference-career-inner{position:relative!important;z-index:3!important;width:100%!important;height:100%!important;min-height:100svh!important;max-width:none!important;padding:0 7vw!important;display:flex!important;align-items:center!important}.careers-page .reference-career-copy h1{color:#fff!important;text-shadow:0 3px 22px rgba(0,0,0,.42)!important}.careers-page .reference-career-copy h1 span{color:#C7EF3E!important}@media(max-width:900px){.careers-page .reference-career-hero .career-hero-image{object-position:58% center!important}.careers-page .reference-career-inner{padding:0 28px!important}.careers-page .reference-career-copy{width:70%!important;max-width:360px!important;transform:translateY(8%)!important}}</style>'''
          if marker2 not in s: p.write_text(s.replace('</head>',css2+'</head>'))
          PY
      - run: git config user.name github-actions[bot]
      - run: git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: git add contact.html careers.html && git commit -m 'Fix visible contact and careers heroes' && git push origin HEAD
