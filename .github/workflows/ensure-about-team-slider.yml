name: Enable About Team Slider

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-about-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure About enhancement scripts are loaded
        shell: python
        run: |
          from pathlib import Path
          path = Path('about.html')
          text = path.read_text(encoding='utf-8')
          tags = ['<script src="about-team-slider.js?v=2" defer></script>','<script src="about-mobile-hero.js?v=1" defer></script>']
          marker = '</body>'
          if marker not in text: raise SystemExit('Could not find </body> in about.html')
          changed = False
          for tag in tags:
              if tag not in text:
                  text = text.replace(marker, tag + '\n' + marker, 1); changed = True
          old_tag = '<script src="about-team-slider.js?v=1" defer></script>'
          if old_tag in text:
              text = text.replace(old_tag, tags[0], 1); changed = True
          if changed: path.write_text(text, encoding='utf-8')

      - name: Apply News, Services, and Contact hero gradients
        shell: bash
        run: python scripts/apply_news_services_hero_gradients.py

      - name: Consolidate Home hero height and viewport rules
        shell: bash
        run: python scripts/consolidate_home_hero.py

      - name: Validate patched pages
        shell: python
        run: |
          from pathlib import Path
          checks = {
              'news.html': 'kalidad-final-news-gradient-fix',
              'services.html': 'kalidad-final-services-gradient-fix',
              'contact.html': 'kalidad-final-contact-gradient-fix',
              'index.html': 'kalidad-home-hero-final',
          }
          for filename, marker in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              if marker not in text: raise SystemExit(f'{filename}: expected marker not found: {marker}')
              print(f'{filename}: validation passed')

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then echo "No changes needed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html news.html services.html contact.html index.html scripts/apply_news_services_hero_gradients.py scripts/consolidate_home_hero.py
          git commit -m "Consolidate home hero viewport rules"
          git push
