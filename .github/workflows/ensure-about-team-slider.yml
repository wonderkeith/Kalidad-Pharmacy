name: Enable About Team Slider

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-about-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure team slider script is loaded
        shell: python
        run: |
          from pathlib import Path

          path = Path('about.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="about-team-slider.js?v=1" defer></script>'

          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in about.html')
              text = text.replace(marker, tag + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
              print('Inserted About team slider script tag.')
          else:
              print('About team slider script tag already present.')

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- about.html; then
            echo "No About page change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Enable About team slider"
          git push
