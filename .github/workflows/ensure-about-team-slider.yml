name: Enable About Team Slider

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-about-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure About enhancement scripts are loaded
        shell: python
        run: |
          from pathlib import Path

          path = Path('about.html')
          text = path.read_text(encoding='utf-8')
          tags = [
              '<script src="about-team-slider.js?v=2" defer></script>',
              '<script src="about-mobile-hero.js?v=1" defer></script>'
          ]

          marker = '</body>'
          if marker not in text:
              raise SystemExit('Could not find </body> in about.html')

          changed = False
          for tag in tags:
              if tag not in text:
                  text = text.replace(marker, tag + '\n' + marker, 1)
                  changed = True

          old_tag = '<script src="about-team-slider.js?v=1" defer></script>'
          if old_tag in text:
              text = text.replace(old_tag, tags[0], 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
              print('Updated About enhancement script tags.')
          else:
              print('About enhancement script tags already present.')

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Ensure About enhancement scripts are loaded"
          git push
