name: Enable About Team Slider

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-about-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure About enhancement scripts are loaded
        shell: python
        run: |
          from pathlib import Path

          path = Path('about.html')
          text = path.read_text(encoding='utf-8')
          tags = [
              '<script src="about-team-slider.js?v=2" defer></script>',
              '<script src="about-mobile-hero.js?v=1" defer></script>'
          ]

          marker = '</body>'
          if marker not in text:
              raise SystemExit('Could not find </body> in about.html')

          changed = False
          for tag in tags:
              if tag not in text:
                  text = text.replace(marker, tag + '\n' + marker, 1)
                  changed = True

          old_tag = '<script src="about-team-slider.js?v=1" defer></script>'
          if old_tag in text:
              text = text.replace(old_tag, tags[0], 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
              print('Updated About enhancement script tags.')
          else:
              print('About enhancement script tags already present.')

      - name: Apply News and Services hero gradients
        shell: python
        run: |
          from pathlib import Path

          patches = {
              'news.html': r'''
<style id="kalidad-final-news-gradient-fix">
/* Final News hero readability gradient: image remains visible while the left side gains a strong forest-green fade. */
.news-hero{
  position:relative!important;
  background-image:url('pharmacist_green_scrubs.webp')!important;
  background-position:center 38%!important;
  background-size:cover!important;
  background-repeat:no-repeat!important;
}
.news-hero::before{
  content:""!important;
  display:block!important;
  position:absolute!important;
  inset:0!important;
  z-index:1!important;
  pointer-events:none!important;
  background:linear-gradient(90deg,rgba(18,41,31,.86) 0%,rgba(18,41,31,.70) 25%,rgba(18,41,31,.38) 48%,rgba(18,41,31,.12) 72%,rgba(18,41,31,.02) 100%)!important;
}
.news-hero .container,
.news-hero .hero-copy{
  position:relative!important;
  z-index:3!important;
}
.news-hero-mobile-img{
  z-index:0!important;
}
@media(max-width:900px){
  .news-hero{
    background-image:none!important;
  }
  .news-hero::before{
    background:linear-gradient(90deg,rgba(18,41,31,.84) 0%,rgba(18,41,31,.66) 30%,rgba(18,41,31,.34) 58%,rgba(18,41,31,.08) 100%)!important;
  }
}
</style>
''',
              'services.html': r'''
<style id="kalidad-final-services-gradient-fix">
/* Final Services hero readability gradient: preserve the full photograph and fade forest green in from the left. */
.page-banner .hero-image{
  z-index:0!important;
}
.page-banner .hero-image img{
  position:relative!important;
  z-index:0!important;
}
.page-banner .hero-image::before{
  content:""!important;
  display:block!important;
  position:absolute!important;
  inset:0!important;
  z-index:1!important;
  pointer-events:none!important;
  background:linear-gradient(90deg,rgba(18,41,31,.86) 0%,rgba(18,41,31,.70) 25%,rgba(18,41,31,.38) 48%,rgba(18,41,31,.12) 72%,rgba(18,41,31,.02) 100%)!important;
}
.page-banner .hero-copy{
  position:relative!important;
  z-index:3!important;
}
@media(max-width:900px){
  .page-banner .hero-image::before{
    background:linear-gradient(90deg,rgba(18,41,31,.84) 0%,rgba(18,41,31,.66) 30%,rgba(18,41,31,.34) 58%,rgba(18,41,31,.08) 100%)!important;
  }
}
</style>
'''
          }

          for filename, css in patches.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              marker = '</head>'
              if marker not in text:
                  raise SystemExit(f'Could not find </head> in {filename}')

              if 'id="kalidad-final-news-gradient-fix"' in text or 'id="kalidad-final-services-gradient-fix"' in text:
                  print(f'{filename}: gradient fix already present.')
                  continue

              text = text.replace(marker, css.strip() + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
              print(f'{filename}: added final hero gradient fix.')

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html news.html services.html
          git commit -m "Fix News and Services hero gradients"
          git push
