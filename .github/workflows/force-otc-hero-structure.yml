name: Force OTC hero structure on service pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/force-otc-hero-structure.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rewrite service hero markup and styles
        shell: python
        run: |
          from pathlib import Path
          import re

          detail_files = [
              'personal-hygiene-oral-care.html',
              'skincare-body-care.html',
              'baby-care.html',
              'health-checks.html',
              'prescription-filling.html',
          ]
          catalog_files = ['nutritional-supplements.html']

          exact_desktop = 'linear-gradient(90deg,rgba(18,41,31,.68) 0%,rgba(18,41,31,.45) 28%,rgba(18,41,31,.12) 58%,rgba(18,41,31,.02) 100%)'
          exact_mobile = 'linear-gradient(90deg,rgba(18,41,31,.66) 0%,rgba(18,41,31,.36) 55%,rgba(18,41,31,.12) 100%)'

          otc_detail = f'''\n<style id="otc-wellness-hero-gradient-match">\n/* STRUCTURAL MATCH: this is the same hero treatment used by OTC Wellness. */\n.service-detail-hero.wellness-parent-hero {{\n  min-height:650px !important;\n  position:relative !important;\n  display:block !important;\n  overflow:hidden !important;\n  background:var(--forest-deep) !important;\n}}\n.service-detail-hero.wellness-parent-hero .service-detail-image {{\n  position:absolute !important;\n  inset:0 !important;\n  min-height:100% !important;\n  width:100% !important;\n  height:100% !important;\n  z-index:0 !important;\n}}\n.service-detail-hero.wellness-parent-hero .service-detail-image::after {{\n  content:"" !important;\n  position:absolute !important;\n  inset:0 !important;\n  background:{exact_desktop} !important;\n  z-index:1 !important;\n  pointer-events:none !important;\n}}\n.service-detail-hero.wellness-parent-hero .service-detail-image img {{\n  width:100% !important;\n  height:100% !important;\n  object-fit:cover !important;\n  object-position:center !important;\n}}\n.service-detail-hero.wellness-parent-hero .service-detail-copy {{\n  position:relative !important;\n  z-index:2 !important;\n  min-height:650px !important;\n  max-width:1180px !important;\n  margin:0 auto !important;\n  padding:110px 24px 90px !important;\n  display:flex !important;\n  flex-direction:column !important;\n  justify-content:center !important;\n  align-items:flex-start !important;\n  opacity:1 !important;\n  transform:none !important;\n}}\n.service-detail-hero.wellness-parent-hero .service-detail-copy h1 {{\n  margin-top:28px !important;\n  max-width:650px !important;\n  color:#fff !important;\n}}\n.service-detail-hero.wellness-parent-hero .service-detail-copy h1 .accent {{\n  color:var(--lime) !important;\n}}\n.service-detail-hero.wellness-parent-hero .service-detail-copy .lead {{\n  max-width:590px !important;\n  color:rgba(255,255,255,.9) !important;\n}}\n.service-detail-hero.wellness-parent-hero .service-detail-copy .kicker {{\n  background:rgba(230,243,217,.94) !important;\n  color:#42652f !important;\n}}\n.service-detail-hero.wellness-parent-hero .service-detail-copy .btn-outline {{\n  border-color:#fff !important;\n  color:#fff !important;\n  background:rgba(18,41,31,.12) !important;\n}}\n@media(max-width:850px) {{\n  .service-detail-hero.wellness-parent-hero {{min-height:650px !important;}}\n  .service-detail-hero.wellness-parent-hero .service-detail-copy {{\n    min-height:650px !important;\n    padding:115px 28px 70px !important;\n  }}\n  .service-detail-hero.wellness-parent-hero .service-detail-image {{\n    height:100% !important;\n    min-height:100% !important;\n  }}\n  .service-detail-hero.wellness-parent-hero .service-detail-image::after {{\n    background:{exact_mobile} !important;\n  }}\n}}\n@media(max-width:560px) {{\n  .service-detail-hero.wellness-parent-hero,\n  .service-detail-hero.wellness-parent-hero .service-detail-copy {{min-height:610px !important;}}\n  .service-detail-hero.wellness-parent-hero .service-detail-copy {{padding:105px 24px 55px !important;}}\n  .service-detail-hero.wellness-parent-hero .service-detail-copy h1 {{font-size:clamp(2.8rem,14vw,4.2rem) !important;}}\n}}\n</style>\n'''

          otc_catalog = f'''\n<style id="otc-wellness-hero-gradient-match">\n/* Exact OTC Wellness hero image overlay. */\n.catalog-page-hero .hero-bg::after {{\n  background:{exact_desktop} !important;\n}}\n.catalog-page-hero h1 {{color:#fff !important;}}\n.catalog-page-hero h1 .accent {{color:var(--lime) !important;}}\n@media(max-width:850px) {{\n  .catalog-page-hero .hero-bg::after {{background:{exact_mobile} !important;}}\n}}\n</style>\n'''

          for name in detail_files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              # Give these heroes the same structural class as OTC Wellness.
              text = re.sub(r'class="service-detail-hero(?! wellness-parent-hero)"', 'class="service-detail-hero wellness-parent-hero"', text, count=1)
              # Remove all prior generated overrides and install one authoritative block.
              text = re.sub(r'\s*<style id="otc-wellness-hero-gradient-match">.*?</style>\s*', '\n', text, flags=re.S)
              text = text.replace('</head>', otc_detail + '</head>', 1)
              p.write_text(text, encoding='utf-8')

          for name in catalog_files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'\s*<style id="otc-wellness-hero-gradient-match">.*?</style>\s*', '\n', text, flags=re.S)
              text = text.replace('</head>', otc_catalog + '</head>', 1)
              p.write_text(text, encoding='utf-8')

          print('FORCED OTC STRUCTURE ON 5 SERVICE HEROES + EXACT OVERLAY ON NUTRITIONAL.')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personal-hygiene-oral-care.html skincare-body-care.html baby-care.html health-checks.html prescription-filling.html nutritional-supplements.html
          git commit -m 'Force service heroes to use OTC Wellness structure'
          git push
