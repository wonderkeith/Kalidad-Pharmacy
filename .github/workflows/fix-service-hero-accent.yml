name: Fix Service Hero Accent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean hero override and accent final word
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              'nutritional-supplements.html',
              'personal-hygiene-oral-care.html',
              'skincare-body-care.html',
              'baby-care.html',
              'health-checks.html',
              'prescription-filling.html',
          ]

          css = '''\n<style id="otc-wellness-hero-gradient-match">\n/* Exact OTC Wellness hero image-overlay gradient, shared across service heroes. */\n.service-detail-hero .service-detail-image::after,\n.catalog-page-hero .hero-bg::after {\n  background: linear-gradient(90deg,rgba(18,41,31,.68) 0%,rgba(18,41,31,.45) 28%,rgba(18,41,31,.12) 58%,rgba(18,41,31,.02) 100%) !important;\n}\n.service-detail-hero .service-detail-copy h1,\n.catalog-page-hero h1 {\n  color: #fff !important;\n}\n.service-detail-hero .service-detail-copy h1 .accent,\n.catalog-page-hero h1 .accent {\n  color: var(--lime) !important;\n}\n@media (max-width:850px) {\n  .service-detail-hero .service-detail-image::after,\n  .catalog-page-hero .hero-bg::after {\n    background: linear-gradient(90deg,rgba(18,41,31,.66) 0%,rgba(18,41,31,.36) 55%,rgba(18,41,31,.12) 100%) !important;\n  }\n}\n</style>\n'''

          titles = [
              'Nutritional Supplements & Boosters',
              'Personal Hygiene & Oral Care',
              'Skincare & Body Care',
              'Baby Care',
              'Health Checks',
              'Prescription Filling',
          ]

          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')

              # Remove every earlier copy of this override, then insert exactly one.
              text = re.sub(r'\n<style id="otc-wellness-hero-gradient-match">[\s\S]*?</style>\n?', '\n', text)

              # Keep the complete heading white and make only its final word lime.
              for title in titles:
                  pattern = rf'(<h1(?:\s[^>]*)?>)({re.escape(title)})(</h1>)'
                  def repl(m):
                      words = m.group(2).rsplit(' ', 1)
                      if len(words) != 2:
                          return m.group(0)
                      return m.group(1) + words[0] + ' <span class="accent">' + words[1] + '</span>' + m.group(3)
                  text = re.sub(pattern, repl, text, count=1, flags=re.I)

              if '</head>' not in text:
                  raise SystemExit(f'Missing </head> in {name}')
              text = text.replace('</head>', css + '</head>', 1)
              path.write_text(text, encoding='utf-8')

          Path('.github/trigger-otc-hero-update.txt').unlink(missing_ok=True)

      - name: Commit final hero treatment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutritional-supplements.html personal-hygiene-oral-care.html skincare-body-care.html baby-care.html health-checks.html prescription-filling.html
          git add -u .github/trigger-otc-hero-update.txt
          git commit -m "Finalize OTC hero gradient and lime accent words"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-service-hero-accent.yml
          git commit -m "Remove temporary hero accent workflow"
          git push
