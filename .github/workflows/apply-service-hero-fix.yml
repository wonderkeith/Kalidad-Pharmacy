name: Service hero repair

on:
  push:
    branches:
      - fix/service-hero-treatment

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch theme.js
        run: python scripts/patch-service-hero.py
      - name: Validate
        run: |
          node --check theme.js
          grep -q 'service-detail-image::after' theme.js
          grep -q 'rgba(18,41,31,.68)' theme.js
          grep -q 'rgba(18,41,31,.66)' theme.js
          grep -q 'service-detail-hero .service-detail-copy h1,.service-detail-hero h1{color:#fff' theme.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply OTC-style treatment to service detail heroes"
          git push
