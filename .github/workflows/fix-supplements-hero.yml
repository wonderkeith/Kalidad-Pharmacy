name: Fix nutritional supplements hero

on:
  push:
    paths:
      - '.github/workflows/fix-supplements-hero.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update hero image sources and full-screen sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nutritional-supplements.html')
          s = p.read_text(encoding='utf-8')

          old_img = '<div class="hero-bg"><img src="https://images.unsplash.com/photo-1550572017-edd951aa8ca9?auto=format&fit=crop&w=1600&q=90" alt="Vitamins and nutritional supplements"></div>'
          new_img = '<div class="hero-bg"><picture><source media="(max-width: 900px)" srcset="Supplements Mobile Hero.webp"><img src="Supplements PC Hero.webp" alt="Vitamins and nutritional supplements"></picture></div>'
          if old_img not in s:
              raise SystemExit('Expected hero image markup was not found; no changes made.')
          s = s.replace(old_img, new_img, 1)

          old_css = '''.catalog-page-hero{min-height:600px;position:relative;overflow:hidden;background:var(--forest-deep);}
.catalog-page-hero .hero-bg{position:absolute;inset:0;}
.catalog-page-hero .hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center;}'''
          new_css = '''.catalog-page-hero{min-height:100svh;position:relative;overflow:hidden;background:var(--forest-deep);}
.catalog-page-hero .hero-bg{position:absolute;inset:0;width:100%;height:100%;}
.catalog-page-hero .hero-bg picture{display:block;width:100%;height:100%;}
.catalog-page-hero .hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center;}'''
          if old_css not in s:
              raise SystemExit('Expected desktop hero CSS was not found; no changes made.')
          s = s.replace(old_css, new_css, 1)

          s = s.replace('.catalog-page-hero .hero-copy{position:relative;z-index:2;min-height:600px;', '.catalog-page-hero .hero-copy{position:relative;z-index:2;min-height:100svh;', 1)
          s = s.replace('.catalog-page-hero,.catalog-page-hero .hero-copy{min-height:570px;}', '.catalog-page-hero,.catalog-page-hero .hero-copy{min-height:100svh;}', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutritional-supplements.html .github/workflows/fix-supplements-hero.yml
          git commit -m "Update supplements hero images and full-screen height"
          git rm .github/workflows/fix-supplements-hero.yml
          git commit -m "Remove temporary supplements hero workflow"
          git push

# trigger run
