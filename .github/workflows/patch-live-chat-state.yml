name: Patch live pharmacist chat state
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-live-chat-state.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer message status
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firebase-chat.js')
          s=p.read_text()
          old="await updateDoc(doc(customerDb,CHAT_COLLECTION,id),{updatedAt:serverTimestamp(),lastMessageAt:serverTimestamp(),status:'active'});"
          new="await updateDoc(doc(customerDb,CHAT_COLLECTION,id),{updatedAt:serverTimestamp(),lastMessageAt:serverTimestamp()});"
          if old not in s:
              raise SystemExit('target customer status update not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firebase-chat.js
          git commit -m "Keep pharmacist queue waiting until staff connects" || exit 0
          git push
      - name: Remove patch workflow
        run: |
          git rm .github/workflows/patch-live-chat-state.yml || true
          git commit -m "Remove temporary live chat patch workflow" || exit 0
          git push
