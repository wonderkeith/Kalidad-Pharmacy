name: Fix chatbot syntax
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix syntax error
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chatbot.js')
          s = p.read_text()
          old = "Q.scrollIntoView({behavior:'smooth',block:'end')})"
          new = "Q.scrollIntoView({behavior:'smooth',block:'end'});})"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              print('Chatbot syntax already fixed; nothing to change.')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatbot.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix chatbot rendering syntax'
          git pull --rebase origin main
          git push origin HEAD:main
