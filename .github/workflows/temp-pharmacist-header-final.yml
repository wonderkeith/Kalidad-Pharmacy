name: Temporary pharmacist header finalization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-pharmacist-header-final.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply only pharmacist header behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pharmacist.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('<script id="pharmacist-hero-header-visibility-script">')
          end = s.index('</script>', start) + len('</script>')
          new = '''<script id="pharmacist-hero-header-visibility-script">
          (function () {
            const header = document.querySelector('header');
            const hero = document.querySelector('.hero');
            if (!header || !hero) return;

            function updateHeaderVisibility() {
              const heroBottom = hero.getBoundingClientRect().bottom;
              const heroVisible = heroBottom > 0;
              header.classList.toggle('kalidad-header-hidden', !heroVisible);
            }

            let ticking = false;
            window.addEventListener('scroll', function () {
              if (ticking) return;
              ticking = true;
              window.requestAnimationFrame(function () {
                updateHeaderVisibility();
                ticking = false;
              });
            }, { passive: true });

            window.addEventListener('resize', updateHeaderVisibility, { passive: true });
            updateHeaderVisibility();
          })();
          </script>'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only pharmacist.html and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pharmacist.html
          git rm .github/workflows/temp-pharmacist-header-final.yml
          git commit -m "Fix pharmacist header hero visibility"
          git push origin HEAD:main
