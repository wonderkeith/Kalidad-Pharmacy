name: Fix services favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix services tab icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services.html')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r'<link\s+rel=["\'](?:icon|shortcut icon)["\'][^>]*>', '', s, flags=re.I)
          marker = '<title>Services | Kalidad Pharmacy</title>'
          favicon = '\n<link rel="icon" type="image/png" href="/kalidad-icon.png?v=3">\n<link rel="shortcut icon" type="image/png" href="/kalidad-icon.png?v=3">'
          s = s.replace(marker, marker + favicon, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services.html
          git diff --cached --quiet || git commit -m 'Fix services browser tab icon'
          git push
