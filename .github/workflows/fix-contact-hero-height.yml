name: Fix Contact Hero Height

on:
  push:
    paths:
      - '.github/contact-hero-height-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply full viewport hero height
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('contact.html')
          s = p.read_text(encoding='utf-8')
          old = 'height:calc(100vh - 84px)!important;min-height:calc(100vh - 84px)!important;'
          old_mobile = 'height:calc(100svh - 84px)!important;min-height:calc(100svh - 84px)!important;'
          new = 'height:100vh!important;min-height:100vh!important;'
          new_mobile = 'height:100svh!important;min-height:100svh!important;'
          if old not in s or old_mobile not in s:
              raise SystemExit('Expected Contact hero height rules were not found; refusing to modify the file.')
          s = s.replace(old, new)
          s = s.replace(old_mobile, new_mobile)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Contact hero fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contact.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Contact hero to fill viewport'
          git push
