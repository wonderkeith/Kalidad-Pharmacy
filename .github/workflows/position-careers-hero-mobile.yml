name: Position Careers Hero Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  position-careers-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Adjust careers mobile hero content
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('careers.html')
          text = path.read_text(encoding='utf-8')

          # Only alter rules inside a mobile media query. Desktop styles remain untouched.
          # Move the existing hero content from the bottom into the left-middle area
          # indicated by the supplied mobile reference image.
          patterns = [
              (r'(@media\s*\([^)]*(?:max-width|max-device-width)[^)]*\)[^{]*\{[\s\S]*?\.hero[^{}]*\.hero-content\s*\{)([\s\S]*?)(\})', None),
          ]

          # Target common careers hero content selectors in mobile CSS and append a
          # narrowly scoped override before the closing media-query block when possible.
          override = '''\n/* Kalidad Pharmacy — careers mobile hero positioning only */\n@media (max-width: 800px) {\n  .hero-content,\n  .careers-hero .hero-content,\n  .hero .hero-content,\n  .career-hero .hero-content {\n    top: 50% !important;\n    bottom: auto !important;\n    left: 6% !important;\n    right: auto !important;\n    transform: translateY(-50%) !important;\n    width: min(78%, 420px) !important;\n    margin: 0 !important;\n  }\n}\n'''

          # Remove a previous copy of this exact override if present, then append it.
          text = re.sub(r'\n/\* Kalidad Pharmacy — careers mobile hero positioning only \*/[\s\S]*?\n\}\n\s*$', '', text)
          text = text.rstrip() + override
          path.write_text(text, encoding='utf-8')

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add careers.html
          git commit -m "Adjust careers mobile hero content position"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/position-careers-hero-mobile.yml
          git commit -m "Remove temporary careers hero workflow"
          git push
