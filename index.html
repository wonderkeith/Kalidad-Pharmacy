<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalidad Pharmacy Fort Portal | Your Health, Your Wealth</title>
<meta name="description" content="Kalidad Pharmacy in Fort Portal, Uganda: 24/7 prescriptions, health checks, wellness products and same-day delivery. Order on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --forest-deep:#12291F;
  --forest:#1E4F3B;
  --forest-mid:#2C6B4F;
  --lime:#C7EF3E;
  --lime-deep:#8FB824;
  --cream:#F6F4EC;
  --card:#FFFFFF;
  --accent-bg:#E6F3D9;
  --accent-fg:#33581F;
  --ink:#16241D;
  --muted:#647166;
  --line:#E4E1D6;
  --radius-lg:28px;
  --radius-md:18px;
  --shadow-soft:0 12px 30px -14px rgba(18,41,31,.28);
  --shadow-card:0 22px 50px -20px rgba(18,41,31,.35);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--ink);
  background:var(--cream);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.font-display{
  font-family:'Nunito',system-ui,sans-serif;
  font-weight:800;
  line-height:1.12;
  margin:0;
  color:var(--forest-deep);
}
p{margin:0;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(246,244,236,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:84px;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-mark{
  width:54px;height:54px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .3s ease;
}
.logo:hover .logo-mark{transform:rotate(-4deg) scale(1.06);}
.logo-mark img{width:100%;height:100%;object-fit:contain;}
.logo-text{display:flex;flex-direction:column;line-height:1.02;}
.logo-text .kalidad{font-family:'Playfair Display',serif;font-weight:800;font-size:1.32rem;letter-spacing:.01em;color:#006837;text-transform:uppercase;}
.logo-text .pharmacy{font-family:'Playfair Display',serif;font-weight:800;font-size:1.18rem;color:#8CC63F;margin-top:-3px;}
.logo-text .tag{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:.62rem;color:#006837;margin-top:3px;opacity:.9;}

nav.main-nav{display:flex;align-items:center;gap:4px;}
nav.main-nav a.nav-link{
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--forest);
  transition:background .2s ease,color .2s ease;
}
nav.main-nav a.nav-link:hover,nav.main-nav a.nav-link.active{background:var(--accent-bg);color:var(--accent-fg);}
.open-badge{
  display:inline-flex;align-items:center;gap:6px;background:var(--accent-bg);color:var(--accent-fg);
  font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  padding:7px 12px;border-radius:999px;margin-left:6px;
}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--forest);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(1.3);}}
.btn{
  display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;
  padding:12px 22px;border-radius:999px;border:2px solid transparent;cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}
.btn:hover{transform:translateY(-1px) scale(1.02);}
.btn-primary{background:var(--forest);color:#fff;box-shadow:var(--shadow-soft);}
.btn-primary:hover{box-shadow:0 16px 30px -12px rgba(18,41,31,.45);}
.btn-outline{border-color:var(--forest);color:var(--forest);background:transparent;}
.btn-outline:hover{background:var(--accent-bg);}
.btn svg{width:18px;height:18px;flex-shrink:0;}
.nav-cta{margin-left:8px;}

.menu-toggle{
  display:none;width:46px;height:46px;border-radius:12px;border:1.5px solid var(--forest);
  background:transparent;color:var(--forest);align-items:center;justify-content:center;cursor:pointer;
}
.mobile-menu{display:none;flex-direction:column;gap:4px;padding:12px 24px 20px;border-top:1px solid var(--line);}
.mobile-menu a{padding:12px 8px;border-radius:10px;font-weight:600;}
.mobile-menu a:hover,.mobile-menu a.active{background:var(--accent-bg);}
.mobile-menu.open{display:flex;}

@media (max-width:900px){
  nav.main-nav{display:none;}
  .menu-toggle{display:flex;}
}

/* ---------- HERO (full-width, blended photo bg) ---------- */
.hero{
  position:relative;
  overflow:hidden;
  min-height:78vh;
  display:flex;
  align-items:center;
  padding:0;
  /* base gradient: solid forest on left → transparent on right, revealing photo */
  background:
    linear-gradient(90deg,
      var(--forest-deep) 0%,
      rgba(30,79,59,.95) 25%,
      rgba(44,107,79,.65) 50%,
      rgba(199,239,62,.15) 78%,
      rgba(255,255,255,0) 100%
    ),
    url('https://images.unsplash.com/photo-1587854692152-cbe660dbde88?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat;
}
.hero::after{
  /* soft white wash on the right for that fade-into-cream feel */
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 55%,rgba(246,244,236,.35) 85%,rgba(246,244,236,.6) 100%);
  pointer-events:none;
}
.hero .container{position:relative;z-index:2;width:100%;padding-top:80px;padding-bottom:80px;}
.hero-grid{display:grid;grid-template-columns:1fr;gap:48px;align-items:center;}
.hero-copy{max-width:640px;color:#fff;}
.hero-copy h1{
  font-size:clamp(2.4rem,5vw,3.8rem);
  color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,.25);
}
.hero-copy h1 .accent{color:var(--lime);}
.hero-copy p.lede{
  margin-top:20px;max-width:520px;
  color:rgba(255,255,255,.92);
  font-size:1.15rem;
  text-shadow:0 1px 10px rgba(0,0,0,.2);
}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;}
.hero-actions .btn-outline{border-color:#fff;color:#fff;}
.hero-actions .btn-outline:hover{background:rgba(255,255,255,.15);}

/* full-width slider */
.slider{
  position:relative;
  width:100%;
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-card);
  aspect-ratio:21/9;
  background:var(--forest-deep);
}
@media(max-width:720px){.slider{aspect-ratio:4/3;}}
.slide{
  position:absolute;inset:0;
  opacity:0;transform:scale(1.04);
  transition:opacity 1s ease,transform 1.2s ease;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:40px;color:#fff;
}
.slide.active{opacity:1;transform:scale(1);}
.slide .slide-icon{
  position:absolute;top:32px;right:32px;width:82px;height:82px;border-radius:22px;
  background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
.slide .slide-icon svg{width:40px;height:40px;color:#fff;}
.slide-tag{align-self:flex-start;background:var(--lime);color:var(--forest-deep);font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:6px 14px;border-radius:999px;margin-bottom:14px;}
.slide h2{color:#fff;font-size:clamp(1.6rem,2.5vw,2.1rem);}
.slide p{margin-top:8px;max-width:420px;font-size:1rem;opacity:.94;}
.slide-bg-1{background:radial-gradient(circle at 25% 20%,#2C6B4F 0%,#12291F 75%);}
.slide-bg-2{background:radial-gradient(circle at 75% 25%,#3E7A57 0%,#12291F 75%);}
.slide-bg-3{background:radial-gradient(circle at 30% 75%,#316049 0%,#12291F 75%);}
.slide-bg-4{background:radial-gradient(circle at 70% 70%,#457C5C 0%,#12291F 75%);}

.slider-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--forest-deep);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s ease,background .2s ease;z-index:3;}
.slider:hover .slider-nav{opacity:1;}
.slider-nav:hover{background:#fff;}
.slider-nav.prev{left:18px;}
.slider-nav.next{right:18px;}
.slider-dots{position:absolute;top:24px;right:24px;display:flex;gap:6px;z-index:3;}
.slider-dots button{height:6px;border-radius:999px;border:none;background:rgba(255,255,255,.45);cursor:pointer;transition:all .4s ease;width:12px;}
.slider-dots button.active{width:28px;background:var(--lime);}

/* ---------- section heading ---------- */
.section{padding:88px 0;}
.section.tight{padding:64px 0;}
.section-head{max-width:600px;margin:0 auto 48px;text-align:center;}
.section-head.left{margin:0 0 40px;text-align:left;}
.section-head .kicker{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--forest-mid);}
.section-head h2{margin-top:10px;font-size:clamp(1.7rem,3vw,2.3rem);}
.section-head p{margin-top:12px;color:var(--muted);}
.leaf-rule{width:60px;height:5px;border-radius:999px;background:var(--lime);margin:18px auto 0;}
.section-head.left .leaf-rule{margin:18px 0 0;}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;}
.reveal.in{opacity:1;transform:none;}

/* ---------- services ---------- */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:920px){.services-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){.services-grid{grid-template-columns:1fr;}}
.service-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:26px;
  transition:transform .25s ease,box-shadow .25s ease;
}
.service-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-soft);}
.service-tag{display:inline-block;background:var(--accent-bg);color:var(--accent-fg);font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:5px 12px;border-radius:999px;}
.service-card h3{margin-top:16px;font-size:1.15rem;}
.service-card p{margin-top:8px;font-size:.9rem;color:var(--muted);}
.explore-wrap{text-align:center;margin-top:40px;}

/* ---------- stats band ---------- */
.stats-band{background:linear-gradient(155deg,var(--forest) 0%,var(--forest-deep) 100%);color:#fff;padding:60px 0;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;text-align:center;}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr;gap:28px;}}
.stat-num{font-family:'Nunito';font-weight:900;font-size:2.6rem;color:var(--lime);}
.stat-label{margin-top:8px;font-size:.9rem;opacity:.85;max-width:14rem;margin-left:auto;margin-right:auto;}

/* ---------- features ---------- */
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:820px){.features-grid{grid-template-columns:1fr;}}
.feature-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:28px;transition:transform .25s ease,box-shadow .25s ease;}
.feature-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-soft);}
.feature-icon{width:52px;height:52px;border-radius:16px;background:var(--accent-bg);color:var(--forest);display:flex;align-items:center;justify-content:center;}
.feature-icon svg{width:26px;height:26px;}
.feature-card h3{margin-top:16px;font-size:1.05rem;}
.feature-card p{margin-top:8px;font-size:.88rem;color:var(--muted);}

/* ---------- footer ---------- */
footer{background:linear-gradient(155deg,var(--forest) 0%,var(--forest-deep) 100%);color:#fff;margin-top:0;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;padding:64px 0 50px;}
@media(max-width:760px){.footer-grid{grid-template-columns:1fr;gap:32px;}}
.footer-grid h4{color:#fff;font-size:1.5rem;}
.footer-grid p.desc{margin-top:10px;opacity:.85;max-width:22rem;font-size:.92rem;}
.footer-col p.head{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;opacity:.65;}
.footer-col ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;font-size:.9rem;}
.footer-col ul a{opacity:.88;}
.footer-col ul a:hover{opacity:1;text-decoration:underline;}
.footer-contact li{display:flex;gap:8px;font-size:.88rem;opacity:.88;align-items:flex-start;}
.footer-contact svg{width:16px;height:16px;margin-top:2px;flex-shrink:0;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.15);}
.footer-bottom .container{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:20px 24px;font-size:.78rem;opacity:.8;}

.wa-float{
  position:fixed;bottom:22px;right:22px;z-index:60;background:var(--forest);color:#fff;
  width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 30px -10px rgba(18,41,31,.55);
}
.wa-float svg{width:26px;height:26px;}
@media(min-width:900px){.wa-float{display:none;}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  html{scroll-behavior:auto;}
}
</style>

</head>
