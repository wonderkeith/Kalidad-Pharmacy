<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kalidad Pharmacy-Your health Your wealth</title>
    <meta name="description" content="Kalidad Pharmacy in Fort Portal, Uganda: 24/7 prescriptions, health checks, wellness products and same-day delivery. Order on WhatsApp.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <style>
        :root {
            --forest-deep: #12291F;
            --forest: #1E4F3B;
            --forest-mid: #2C6B4F;
            --lime: #C7EF3E;
            --lime-deep: #8FB824;
            --cream: #F6F4EC;
            --card: #FFFFFF;
            --accent-bg: #E6F3D9;
            --accent-fg: #33581F;
            --ink: #16241D;
            --muted: #647166;
            --line: #E4E1D6;
            --radius-lg: 28px;
            --radius-md: 18px;
            --shadow-soft: 0 12px 30px -14px rgba(18, 41, 31, .28);
            --shadow-card: 0 22px 50px -20px rgba(18, 41, 31, .35);
        }
        * {
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            font-family: 'Lora', serif;
            color: var(--ink);
            background: var(--cream);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        h1,
        h2,
        h3,
        .font-display {
            font-family: 'Lora', serif;
            font-weight: 800;
            line-height: 1.12;
            margin: 0;
            color: var(--forest-deep);
        }
        p {
            margin: 0;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        img {
            max-width: 100%;
            display: block;
        }
        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        /* ---------- header ---------- */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(246, 244, 236, .92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            height: 84px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-mark {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform .3s ease;
        }
        .logo:hover .logo-mark {
            transform: rotate(-4deg) scale(1.06);
        }
        .logo-mark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.02;
        }
        .logo-text .kalidad {
            font-family: 'Lora', serif;
            font-weight: 800;
            font-size: 1.32rem;
            letter-spacing: .01em;
            color: #006837;
            text-transform: uppercase;
        }
        .logo-text .pharmacy {
            font-family: 'Lora', serif;
            font-weight: 800;
            font-size: 1.18rem;
            color: #8CC63F;
            margin-top: -3px;
        }
        .logo-text .tag {
            font-family: 'Lora', serif;
            font-style: italic;
            font-weight: 600;
            font-size: .62rem;
            color: #006837;
            margin-top: 3px;
            opacity: .9;
        }

        nav.main-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        nav.main-nav a.nav-link {
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 600;
            font-size: .9rem;
            color: var(--forest);
            transition: background .2s ease, color .2s ease;
        }
        nav.main-nav a.nav-link:hover,
        nav.main-nav a.nav-link.active {
            background: var(--accent-bg);
            color: var(--accent-fg);
        }
        .open-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-bg);
            color: var(--accent-fg);
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
            padding: 7px 12px;
            border-radius: 999px;
            margin-left: 6px;
        }
        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--forest);
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .45;
                transform: scale(1.3);
            }
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: .9rem;
            padding: 12px 22px;
            border-radius: 999px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .btn:hover {
            transform: translateY(-1px) scale(1.02);
        }
        .btn-primary {
            background: var(--forest);
            color: #fff;
            box-shadow: var(--shadow-soft);
        }
        .btn-primary:hover {
            box-shadow: 0 16px 30px -12px rgba(18, 41, 31, .45);
        }
        .btn-outline {
            border-color: var(--forest);
            color: var(--forest);
            background: transparent;
        }
        .btn-outline:hover {
            background: var(--accent-bg);
        }
        .btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .nav-cta {
            margin-left: 8px;
        }

        .menu-toggle {
            display: none;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            border: 1.5px solid var(--forest);
            background: transparent;
            color: var(--forest);
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .mobile-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: 12px 24px 20px;
            border-top: 1px solid var(--line);
        }
        .mobile-menu a {
            padding: 12px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .mobile-menu a:hover,
        .mobile-menu a.active {
            background: var(--accent-bg);
        }
        .mobile-menu.open {
            display: flex;
        }

        @media (max-width: 900px) {
            nav.main-nav {
                display: none;
            }
            .menu-toggle {
                display: flex;
            }
        }

        /* ---------- page header banner (non-home pages) ---------- */
        .page-banner {
            position: relative;
            overflow: hidden;
            padding: 56px 0 64px;
            background: linear-gradient(155deg, var(--forest) 0%, var(--forest-deep) 100%);
            color: #fff;
        }
        .page-banner .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .35;
            pointer-events: none;
            background: var(--lime);
            width: 300px;
            height: 300px;
            top: -120px;
            right: -80px;
        }
        .page-banner .kicker {
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .16em;
            color: var(--lime);
        }
        .page-banner h1 {
            color: #fff;
            margin-top: 10px;
            font-size: clamp(2rem, 4vw, 2.7rem);
        }
        .page-banner p {
            margin-top: 12px;
            max-width: 520px;
            opacity: .85;
        }
        .breadcrumb {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: .82rem;
            opacity: .75;
            margin-bottom: 16px;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* ---------- hero (home) ---------- */
        .hero {
            position: relative;
            overflow: hidden;
            min-height: clamp(620px, calc(100vh - 84px), 780px);
            padding: 54px 0 72px;
            display: flex;
            align-items: center;
            /* ONLY the requested two-colour hero background: white -> existing green. */
            background: linear-gradient(90deg, #fff 0%, #fff 28%, var(--forest) 72%, var(--forest) 100%);
        }

        /* The old decorative blobs are intentionally removed so they cannot introduce extra colours. */
        .blob {
            display: none;
        }

        .hero-grid {
            position: relative;
            z-index: 2;
            width: 100%;
            display: grid;
            grid-template-columns: minmax(330px, .82fr) minmax(0, 1.48fr);
            gap: 28px;
            align-items: center;
        }

        .hero-copy {
            position: relative;
            z-index: 5;
            max-width: 560px;
        }

        @media (max-width: 940px) {
            .hero {
                min-height: auto;
                padding: 58px 0 70px;
                /* Keep the requested left-to-right white -> green fade on tablet. */
                background: linear-gradient(90deg, #fff 0%, #fff 30%, var(--forest) 78%, var(--forest) 100%);
            }

            .hero-grid {
                grid-template-columns: 1fr;
                gap: 28px;
            }

            .hero-copy {
                max-width: 680px;
            }
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-bg);
            color: var(--accent-fg);
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .14em;
            padding: 8px 16px;
            border-radius: 999px;
        }

        .eyebrow .pulse-dot {
            background: var(--forest-mid);
        }

        .hero h1 {
            font-size: clamp(2.1rem, 4vw, 3.1rem);
            margin-top: 20px;
        }

        .hero h1 .accent {
            color: var(--lime-deep);
            position: relative;
        }

        .hero p.lede {
            margin-top: 18px;
            max-width: 520px;
            color: var(--muted);
            font-size: 1.08rem;
        }

        .hero-visual {
            position: relative;
            min-width: 0;
            width: min(780px, 62vw);
            margin-left: auto;
            z-index: 3;
        }

        .slider {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            overflow: hidden;
            border-radius: 34px;
            background: transparent;
            box-shadow: none;
            isolation: isolate;
            /* Subtly fades the existing slider into the hero background at its edges. */
            -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.45) 8%, #000 18%, #000 82%, rgba(0,0,0,.65) 94%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.45) 8%, #000 18%, #000 82%, rgba(0,0,0,.65) 94%, transparent 100%);
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(1.06);
            transition: opacity 1s ease, transform 1.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: clamp(28px, 4vw, 46px);
            color: #fff;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
        }

        .slide .slide-icon {
            position: absolute;
            top: clamp(24px, 3vw, 36px);
            right: clamp(24px, 3vw, 36px);
            width: 78px;
            height: 78px;
            border-radius: 22px;
            background: rgba(255, 255, 255, .14);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        .slide .slide-icon svg {
            width: 38px;
            height: 38px;
            color: #fff;
        }

        .slide-tag {
            align-self: flex-start;
            background: var(--lime);
            color: var(--forest-deep);
            font-size: .66rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .1em;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        .slide h2 {
            color: #fff;
            font-size: clamp(1.6rem, 3vw, 2.15rem);
            position: relative;
            z-index: 2;
        }

        .slide p {
            margin-top: 6px;
            max-width: 380px;
            font-size: .95rem;
            opacity: .92;
            position: relative;
            z-index: 2;
        }

        .slide-bg-1 {
            background: radial-gradient(circle at 25% 20%, #2C6B4F 0%, #12291F 75%);
        }
        .slide-bg-2 {
            background: radial-gradient(circle at 75% 25%, #3E7A57 0%, #12291F 75%);
        }
        .slide-bg-3 {
            background: radial-gradient(circle at 30% 75%, #316049 0%, #12291F 75%);
        }
        .slide-bg-4 {
            background: radial-gradient(circle at 70% 70%, #457C5C 0%, #12291F 75%);
        }

        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .88);
            color: var(--forest-deep);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity .2s ease, background .2s ease;
            z-index: 4;
        }
        .slider:hover .slider-nav {
            opacity: 1;
        }
        .slider-nav:hover {
            background: #fff;
        }
        .slider-nav.prev {
            left: 18px;
        }
        .slider-nav.next {
            right: 18px;
        }
        .slider-dots {
            position: absolute;
            top: 22px;
            right: 24px;
            display: flex;
            gap: 6px;
            z-index: 4;
        }
        .slider-dots button {
            height: 6px;
            border-radius: 999px;
            border: none;
            background: rgba(255, 255, 255, .45);
            cursor: pointer;
            transition: all .4s ease;
            width: 12px;
        }
        .slider-dots button.active {
            width: 26px;
            background: var(--lime);
        }

        @media (max-width: 940px) {
            .hero-visual {
                width: 100%;
                max-width: 900px;
                margin: 0 auto;
            }
            .slider {
                aspect-ratio: 16/9;
                border-radius: 30px;
                -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.45) 8%, #000 18%, #000 82%, rgba(0,0,0,.65) 94%, transparent 100%);
                mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.45) 8%, #000 18%, #000 82%, rgba(0,0,0,.65) 94%, transparent 100%);
            }
        }

        @media (max-width: 620px) {
            .hero {
                padding: 42px 0 46px;
                /* Still strictly horizontal: white on the left, existing green on the right. */
                background: linear-gradient(90deg, #fff 0%, #fff 32%, var(--forest) 82%, var(--forest) 100%);
            }
            .hero-grid {
                gap: 20px;
            }
            .hero h1 {
                font-size: clamp(2rem, 10vw, 2.7rem);
            }
            .hero p.lede {
                font-size: 1rem;
            }
            .hero-visual {
                width: calc(100% + 32px);
                margin-left: -16px;
            }
            .slider {
                aspect-ratio: 4/3;
                border-radius: 24px;
                -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.45) 7%, #000 18%, #000 82%, rgba(0,0,0,.65) 93%, transparent 100%);
                mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.45) 7%, #000 18%, #000 82%, rgba(0,0,0,.65) 93%, transparent 100%);
            }
            .slide {
                padding: 26px;
            }
            .slide .slide-icon {
                width: 58px;
                height: 58px;
                top: 22px;
                right: 22px;
                border-radius: 17px;
            }
            .slide .slide-icon svg {
                width: 30px;
                height: 30px;
            }
            .slide h2 {
                font-size: 1.45rem;
            }
            .slide p {
                max-width: 300px;
                font-size: .85rem;
            }
            .slider-nav {
                opacity: 1;
                width: 38px;
                height: 38px;
            }
            .slider-nav.prev {
                left: 12px;
            }
            .slider-nav.next {
                right: 12px;
            }
            .slider-dots {
                top: 16px;
                right: 16px;
            }
        }

        /* ---------- section heading ---------- */
        .section {
            padding: 88px 0;
        }
        .section.tight {
            padding: 64px 0;
        }
        .section-head {
            max-width: 600px;
            margin: 0 auto 48px;
            text-align: center;
        }
        .section-head.left {
            margin: 0 0 40px;
            text-align: left;
        }
        .section-head .kicker {
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .16em;
            color: var(--forest-mid);
        }
        .section-head h2 {
            margin-top: 10px;
            font-size: clamp(1.7rem, 3vw, 2.3rem);
        }
        .section-head p {
            margin-top: 12px;
            color: var(--muted);
        }
        .leaf-rule {
            width: 60px;
            height: 5px;
            border-radius: 999px;
            background: var(--lime);
            margin: 18px auto 0;
        }
        .section-head.left .leaf-rule {
            margin: 18px 0 0;
        }

        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity .7s ease, transform .7s ease;
        }
        .reveal.in {
            opacity: 1;
            transform: none;
        }

        /* ---------- services ---------- */
        .services-showcase {
            position: relative;
            display: grid;
            grid-template-columns: minmax(280px, .92fr) minmax(0, 1.28fr);
            min-height: 520px;
            background: var(--card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .services-stage {
            position: relative;
            min-height: 520px;
            overflow: hidden;
            background: #fff;
        }

        .service-slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: clamp(28px, 4vw, 46px);
            color: #8CC63F;
            opacity: 0;
            transform: translateY(100%);
            transition: transform .62s cubic-bezier(.22,.61,.36,1), opacity .25s ease;
            pointer-events: none;
            will-change: transform, opacity;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-color: #fff;
        }

        .service-slide.is-active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .service-slide.is-exiting-up {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .service-slide.is-exiting-down {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }

        .service-slide.is-entering-from-up {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .service-slide.is-entering-from-down {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }

        /* Soft white fade from the left into a fully clear image on the right. */
        .service-slide::after {
            content: "";
            display: block;
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(90deg,
                rgba(255,255,255,.88) 0%,
                rgba(255,255,255,.82) 28%,
                rgba(255,255,255,.58) 43%,
                rgba(255,255,255,.24) 54%,
                rgba(255,255,255,0) 70%,
                rgba(255,255,255,0) 100%
            );
        }

        .service-slide > * {
            position: relative;
            z-index: 2;
        }

        .service-visual-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .service-icon-large,
        .service-visual-label,
        .service-visual-top {
            display: none !important;
        }

        .service-slide-copy {
            position: relative;
            z-index: 2;
            max-width: 650px;
            margin-top: auto;
        }

        .service-slide-copy h3 {
            color: #8CC63F;
            font-size: clamp(1.8rem, 3.4vw, 2.65rem);
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,.45);
        }

        .service-slide-copy p {
            margin-top: 0;
            color: #8CC63F;
            max-width: 650px;
            font-size: .96rem;
            line-height: 1.55;
            text-shadow: 0 2px 8px rgba(0,0,0,.45);
        }


        /* Embedded HD service images — supplied by the user */
        .service-slide[data-service="0"] { background-image: url("image-01-9657b188ea.webp"); }
        .service-slide[data-service="1"] { background-image: url("image-02-3ac17888ff.webp"); }
        .service-slide[data-service="2"] { background-image: url("image-03-2d9eae353b.webp"); }
        .service-slide[data-service="3"] { background-image: url("image-04-7968a81e54.webp"); }
        .service-slide[data-service="4"] { background-image: url("image-05-294d1af811.webp"); }
        .service-slide[data-service="5"] { background-image: url("image-06-f0b58c89f6.webp"); }

        .service-display {
            position: relative;
            min-width: 0;
            padding: clamp(32px, 5vw, 56px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--card);
        }

        .service-display-kicker {
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .16em;
            color: var(--forest-mid);
        }

        .service-display h3 {
            margin-top: 10px;
            font-size: clamp(1.9rem, 4vw, 3rem);
        }

        .service-display p.intro {
            margin-top: 12px;
            max-width: 600px;
            color: var(--muted);
            font-size: .96rem;
        }

        .service-content-window {
            position: relative;
            min-height: 250px;
            margin-top: 26px;
            overflow: hidden;
        }

        .service-content-panel {
            position: absolute;
            inset: 0;
