<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Editor | Kalidad Admin</title><link rel="stylesheet" href="../css/store.css"><style>.form{display:grid;gap:14px;max-width:760px}.form label{display:grid;gap:6px;font-weight:700}.form input,.form textarea,.form select{font:inherit;padding:12px;border:1px solid #d9ded8;border-radius:12px;background:#fff}.check{display:flex!important;align-items:center;gap:10px!important}.check input{width:auto}.actions{display:flex;gap:10px;flex-wrap:wrap}.success{color:#18794e}.error{color:#b42318}.preview{max-width:180px;border-radius:14px;display:none}.muted{color:#66736b;font-size:.9rem}</style></head>
<body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Admin</a><div class="nav-actions"><a class="pill alt" href="products.html">Products</a><a class="pill alt" href="../store/index.html">View store</a></div></nav><main class="panel"><h1 id="title">Add product</h1><p class="muted">Create a product or edit an existing product in the live Firestore catalogue.</p><form id="form" class="form"><label>Name<input id="name" required></label><label>Category<select id="categoryId"><option value="">Select category</option></select></label><label>Category name<input id="categoryName" placeholder="Used as a display fallback"></label><label>Price (UGX)<input id="price" type="number" min="0" step="1" required></label><label>Sale price (UGX)<input id="salePrice" type="number" min="0" step="1" placeholder="Optional"></label><label>Stock<input id="stock" type="number" min="0" step="1" value="0"></label><label>Image URL<input id="image" type="url" placeholder="https://..."><img id="preview" class="preview" alt="Product preview"></label><label>Description<textarea id="description" rows="5"></textarea></label><label class="check"><input id="featured" type="checkbox"> Featured product</label><label class="check"><input id="requiresPrescription" type="checkbox"> Prescription required</label><label class="check"><input id="active" type="checkbox" checked> Active / visible in store</label><div class="actions"><button class="pill" type="submit" id="save">Save product</button><a class="pill alt" href="products.html">Cancel</a></div><p id="message" aria-live="polite"></p></form></main></div>
<script type="module">import{requireAdmin}from'../js/auth-guard.js';import{db}from'../js/firebase-config.js';import{collection,addDoc,getDocs,getDoc,doc,query,where,orderBy,serverTimestamp,updateDoc}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';requireAdmin();const $=id=>document.getElementById(id),form=$('form'),productId=new URLSearchParams(location.search).get('id'),fields=['name','categoryId','categoryName','price','salePrice','stock','image','description','featured','requiresPrescription','active'];function fill(p){for(const k of fields){const el=$(k);if(!el)continue;if(el.type==='checkbox')el.checked=p[k]===true;else el.value=p[k]??''}$('active').checked=p.active!==false;$('title').textContent='Edit product';$('save').textContent='Save changes';updatePreview()}async function loadCategories(){const s=await getDocs(query(collection(db,'categories'),where('active','==',true),orderBy('displayOrder')));s.docs.forEach(d=>{const c=d.data(),o=document.createElement('option');o.value=d.id;o.textContent=c.name||d.id;$('categoryId').appendChild(o)})}async function loadProduct(){if(!productId)return;const s=await getDoc(doc(db,'products',productId));if(!s.exists()){$('message').textContent='Product not found.';$('message').className='error';return}fill(s.data())}function updatePreview(){const u=$('image').value.trim();if(u){$('preview').src=u;$('preview').style.display='block'}else $('preview').style.display='none'}$('image').addEventListener('input',updatePreview);form.onsubmit=async e=>{e.preventDefault();$('message').textContent='Saving...';$('message').className='';const data={name:$('name').value.trim(),categoryId:$('categoryId').value.trim(),categoryName:$('categoryName').value.trim(),price:Number($('price').value),salePrice:$('salePrice').value?Number($('salePrice').value):null,stock:Number($('stock').value||0),image:$('image').value.trim(),description:$('description').value.trim(),featured:$('featured').checked,requiresPrescription:$('requiresPrescription').checked,active:$('active').checked,updatedAt:serverTimestamp()};try{if(productId){await updateDoc(doc(db,'products',productId),data);$('message').textContent='Product updated successfully.'}else{data.createdAt=serverTimestamp();await addDoc(collection(db,'products'),data);$('message').textContent='Product created successfully.';form.reset();$('active').checked=true;$('preview').style.display='none'}$('message').className='success'}catch(err){console.error(err);$('message').textContent=err.message;$('message').className='error'}};try{await loadCategories();await loadProduct()}catch(e){console.error(e);$('message').textContent='Unable to load product data. Check Firestore permissions.';$('message').className='error'}</script></body></html>
