<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product | Kalidad Admin</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Admin</a><a class="pill alt" href="products.html">Products</a></nav><main class="panel"><h1>Add product</h1><form id="form" class="form"><label>Name<input id="name" required></label><label>Category ID<input id="categoryId" placeholder="e.g. supplements"></label><label>Category name<input id="categoryName"></label><label>Price (UGX)<input id="price" type="number" min="0" required></label><label>Sale price (UGX)<input id="salePrice" type="number" min="0"></label><label>Stock<input id="stock" type="number" min="0" value="0"></label><label>Image URL<input id="image" type="url" placeholder="https://..."></label><label>Description<textarea id="description" rows="5"></textarea></label><label><input id="featured" type="checkbox"> Featured product</label><label><input id="requiresPrescription" type="checkbox"> Prescription required</label><button class="pill">Save product</button><p id="message"></p></form></main></div><script type="module">import{requireAdmin}from'../js/auth-guard.js';import{db}from'../js/firebase-config.js';import{collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';requireAdmin();form.onsubmit=async e=>{e.preventDefault();message.textContent='Saving...';try{await addDoc(collection(db,'products'),{name:name.value.trim(),categoryId:categoryId.value.trim(),categoryName:categoryName.value.trim(),price:Number(price.value),salePrice:salePrice.value?Number(salePrice.value):null,stock:Number(stock.value||0),image:image.value.trim(),description:description.value.trim(),featured:featured.checked,requiresPrescription:requiresPrescription.checked,active:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});message.textContent='Product saved.';form.reset()}catch(err){message.textContent=err.message;message.className='error'}};</script></body></html>
