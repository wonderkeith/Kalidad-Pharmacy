<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Kalidad Admin</title><link rel="stylesheet" href="../css/store.css"><style>.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #d9ded8;border-radius:12px;font:inherit}.edit{white-space:nowrap}.low{font-weight:800}.muted{color:#66736b}</style></head>
<body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Admin</a><div class="nav-actions"><a class="pill" href="product-edit.html">+ Add product</a><a class="pill alt" href="../store/index.html">View store</a></div></nav><h1>Products</h1><div class="toolbar"><input id="search" placeholder="Search products..."><select id="status"><option value="all">All products</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="low">Low stock (≤5)</option></select></div><main id="list"><p>Loading...</p></main></div>
<script type="module">import{requireAdmin}from'../js/auth-guard.js';import{db}from'../js/firebase-config.js';import{collection,getDocs,query,orderBy,updateDoc,doc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import{money,escapeHtml}from'../js/products.js';requireAdmin();const root=document.querySelector('#list'),search=document.querySelector('#search'),status=document.querySelector('#status');let products=[];function render(){const q=search.value.trim().toLowerCase(),f=status.value;const list=products.filter(p=>(!q||`${p.name||''} ${p.categoryName||''}`.toLowerCase().includes(q))&&(f==='all'||(f==='active'&&p.active!==false)||(f==='inactive'&&p.active===false)||(f==='low'&&Number(p.stock||0)<=5)));root.innerHTML=list.length?`<div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(p=>{const low=Number(p.stock||0)<=5;return`<tr><td><strong>${escapeHtml(p.name||'Unnamed')}</strong><br><small class="muted">${escapeHtml(p.categoryName||p.categoryId||'')}</small></td><td>${money(p.salePrice??p.price)}</td><td class="${low?'low':''}">${p.stock??0}</td><td>${p.active===false?'Inactive':'Active'}</td><td><a class="pill alt edit" href="product-edit.html?id=${encodeURIComponent(p.id)}">Edit</a> <button class="pill toggle" data-id="${escapeHtml(p.id)}" data-active="${p.active!==false}">${p.active===false?'Activate':'Deactivate'}</button></td></tr>`}).join('')}</tbody></table></div></div>`:'<div class="empty">No products match your filters.</div>';root.querySelectorAll('.toggle').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await updateDoc(doc(db,'products',b.dataset.id),{active:b.dataset.active!=='true',updatedAt:serverTimestamp()});await load()}catch(e){console.error(e);b.disabled=false;alert(e.message)}})}async function load(){try{const s=await getDocs(query(collection(db,'products'),orderBy('name')));products=s.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){root.innerHTML='<div class="empty">Unable to load products. Check Firestore permissions.</div>';console.error(e)}}search.oninput=render;status.onchange=render;load();</script></body></html>
