<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Kalidad Admin</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Admin</a><div class="nav-actions"><a class="pill" href="product-edit.html">+ Add product</a><a class="pill alt" href="../store/index.html">View store</a></div></nav><h1>Products</h1><main id="list"><p>Loading...</p></main></div><script type="module">import{requireAdmin}from'../js/auth-guard.js';import{db}from'../js/firebase-config.js';import{collection,getDocs,query,orderBy}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import{money,escapeHtml}from'../js/products.js';requireAdmin();const root=document.querySelector('#list');try{const s=await getDocs(query(collection(db,'products'),orderBy('name')));root.innerHTML=`<div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody>${s.docs.map(d=>{const p=d.data();return`<tr><td>${escapeHtml(p.name)}</td><td>${money(p.salePrice??p.price)}</td><td>${p.stock??0}</td><td><span class="status">${p.active===false?'Inactive':'Active'}</span></td></tr>`}).join('')}</tbody></table></div></div>`}catch(e){root.innerHTML='<div class="empty">Unable to load products. Check Firestore permissions.</div>';console.error(e)}</script></body></html>
