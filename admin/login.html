<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell" style="max-width:520px;padding-top:8vh"><main class="panel"><p class="brand">Kalidad Pharmacy</p><h1>Admin portal</h1><p>Authorized staff only.</p><form id="form" class="form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="pill" type="submit">Sign in</button><p id="message" aria-live="polite"></p></form></main></div><script type="module">import{login,getUserProfile}from'../js/auth.js';const f=document.querySelector('#form'),m=document.querySelector('#message');f.onsubmit=async e=>{e.preventDefault();m.textContent='Signing in...';try{const u=await login(email.value,password.value),p=await getUserProfile(u.uid);if(!p||!['admin','superadmin','staff'].includes(p.role)||p.active===false)throw new Error('This account is not authorized for the admin portal.');location.href='index.html'}catch(err){m.textContent=err.message;m.className='error'}};</script></body></html>
