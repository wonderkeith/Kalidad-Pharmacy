<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Kalidad Pharmacy"><style>:root{--forest:#1E4F3B;--lime:#C7EF3E;--cream:#F6F4EC}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);background:white;padding:32px;border-radius:24px;box-shadow:0 20px 60px #12291f22}h1{text-align:center;color:var(--forest);margin:0 0 8px}p{text-align:center;color:#647166;margin:0 0 24px}form{display:grid;gap:14px}label{display:grid;gap:7px;font-size:13px;font-weight:700}input{padding:13px;border:1px solid #dfe4dc;border-radius:12px;font:inherit}button{padding:14px;border:0;border-radius:999px;background:var(--forest);color:#fff;font-weight:700;cursor:pointer}.message{text-align:center;min-height:20px;font-size:14px}</style></head><body><main class="card"><h1>Kalidad Admin</h1><p>Secure administration portal</p><form id="form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button><div id="message" class="message" aria-live="polite"></div></form></main><script type="module">import{login}from'../js/auth.js';import{db}from'../js/firebase-config.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Signing in...';try{const user=await login(email.value,password.value);const snap=await getDoc(doc(db,'users',user.uid));const profile=snap.exists()?snap.data():null;if(!profile||!['staff','admin','superadmin'].includes(profile.role)||profile.active===false){message.textContent='This account is not authorized for administration.';return}window.location.href='index.html'}catch(error){message.textContent='Unable to sign in. Check your credentials.';console.error(error)}});</script></body></html>
