<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers | Kalidad Admin</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Admin</a></nav><h1>Customers</h1><main id="customers"><p>Loading...</p></main></div><script type="module">import{requireAdmin}from'../js/auth-guard.js';import{db}from'../js/firebase-config.js';import{collection,getDocs,query,orderBy}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import{escapeHtml}from'../js/products.js';requireAdmin();try{const s=await getDocs(query(collection(db,'users'),orderBy('createdAt','desc')));document.querySelector('#customers').innerHTML=`<div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th></tr></thead><tbody>${s.docs.map(d=>{const u=d.data();return`<tr><td>${escapeHtml(`${u.firstName||''} ${u.lastName||''}`)}</td><td>${escapeHtml(u.email||'')}</td><td>${escapeHtml(u.phone||'')}</td><td>${escapeHtml(u.role||'customer')}</td></tr>`}).join('')}</tbody></table></div></div>`}catch(e){document.querySelector('#customers').innerHTML='<div class="empty">Unable to load customers.</div>';console.error(e)}</script></body></html>
