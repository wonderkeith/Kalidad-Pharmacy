<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Kalidad Admin</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Admin</a><a class="pill alt" href="../store/index.html">Store</a></nav><h1>Customer orders</h1><main id="orders"><p>Loading...</p></main></div><script type="module">import{requireAdmin}from'../js/auth-guard.js';import{db}from'../js/firebase-config.js';import{collection,getDocs,query,orderBy,updateDoc,doc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import{money,escapeHtml}from'../js/products.js';requireAdmin();const statuses=['pending','confirmed','preparing','ready','out_for_delivery','completed','cancelled'];async function load(){try{const s=await getDocs(query(collection(db,'orders'),orderBy('createdAt','desc')));document.querySelector('#orders').innerHTML=s.docs.length?s.docs.map(d=>{const o=d.data(),status=o.orderStatus||'pending';return`<article class="panel" style="margin-bottom:15px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong>${escapeHtml(o.orderNumber||d.id)}</strong><select class="status-select" data-id="${d.id}">${statuses.map(x=>`<option ${x===status?'selected':''}>${x}</option>`).join('')}</select></div><p>${escapeHtml(o.customer?.name||'Customer')} · ${escapeHtml(o.customer?.phone||'')} · <strong>${money(o.total)}</strong></p><p>${(o.items||[]).map(i=>`${escapeHtml(i.name)} × ${i.quantity}`).join(', ')}</p><small>${escapeHtml(o.deliveryAddress?.address||'')}</small></article>`}).join(''):'<div class="empty">No orders yet.</div>';document.querySelectorAll('.status-select').forEach(s=>s.onchange=async()=>{await updateDoc(doc(db,'orders',s.dataset.id),{orderStatus:s.value,updatedAt:serverTimestamp()});load()})}catch(e){document.querySelector('#orders').innerHTML='<div class="empty">Unable to load orders. Check Firestore permissions.</div>';console.error(e)}}load();</script></body></html>
