<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Kalidad Admin</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Admin</a><a class="pill alt" href="../store/index.html">Store</a></nav><h1>Customer orders</h1><main id="orders"><p>Loading...</p></main></div><script type="module">import{requireAdmin}from'../js/auth-guard.js';import{db}from'../js/firebase-config.js';import{collection,getDocs,query,orderBy}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import{money,escapeHtml}from'../js/products.js';requireAdmin();try{const s=await getDocs(query(collection(db,'orders'),orderBy('createdAt','desc')));document.querySelector('#orders').innerHTML=s.docs.length?s.docs.map(d=>{const o=d.data();return`<article class="panel" style="margin-bottom:15px"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${escapeHtml(o.orderNumber||d.id)}</strong><span class="status">${escapeHtml(o.orderStatus||'pending')}</span></div><p>${escapeHtml(o.customer?.name||'Customer')} · ${escapeHtml(o.customer?.phone||'')} · ${money(o.total)}</p><p>${(o.items||[]).map(i=>`${escapeHtml(i.name)} × ${i.quantity}`).join(', ')}</p><small>${escapeHtml(o.deliveryAddress?.address||'')}</small></article>`}).join(''):'<div class="empty">No orders yet.</div>'}catch(e){document.querySelector('#orders').innerHTML='<div class="empty">Unable to load orders. Check Firestore permissions.</div>';console.error(e)}</script></body></html>
