<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Content | Kalidad Admin</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Admin</a></nav><main class="panel"><h1>Website content</h1><p>This editor stores homepage content in Firestore. Existing static pages will be connected to it during the next integration pass.</p><form id="form" class="form"><label>Hero title<input id="heroTitle"></label><label>Hero subtitle<textarea id="heroSubtitle" rows="4"></textarea></label><label>Hero image URL<input id="heroImage" type="url"></label><button class="pill">Save homepage content</button><p id="message"></p></form></main></div><script type="module">import{requireAdmin}from'../js/auth-guard.js';import{db}from'../js/firebase-config.js';import{doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';requireAdmin();const f=document.querySelector('#form'),m=document.querySelector('#message');const ref=doc(db,'website','homepage');try{const s=await getDoc(ref);if(s.exists()){const x=s.data();heroTitle.value=x.heroTitle||'';heroSubtitle.value=x.heroSubtitle||'';heroImage.value=x.heroImage||''}}catch(e){m.textContent=e.message}f.onsubmit=async e=>{e.preventDefault();try{await setDoc(ref,{heroTitle:heroTitle.value.trim(),heroSubtitle:heroSubtitle.value.trim(),heroImage:heroImage.value.trim(),updatedAt:serverTimestamp()},{merge:true});m.textContent='Homepage content saved.';m.className='success'}catch(err){m.textContent=err.message;m.className='error'}};</script></body></html>
