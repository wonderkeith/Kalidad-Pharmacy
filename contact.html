<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | Kalidad Pharmacy</title>
<meta name="description" content="Contact Kalidad Pharmacy in Fort Portal, Uganda. Open 24/7. Call, WhatsApp, or send a message.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --forest-deep:#12291F;
  --forest:#1E4F3B;
  --forest-mid:#2C6B4F;
  --lime:#C7EF3E;
  --lime-deep:#8FB824;
  --cream:#F6F4EC;
  --card:#FFFFFF;
  --accent-bg:#E6F3D9;
  --accent-fg:#33581F;
  --ink:#16241D;
  --muted:#647166;
  --line:#E4E1D6;
  --radius-lg:28px;
  --radius-md:18px;
  --shadow-soft:0 12px 30px -14px rgba(18,41,31,.28);
  --shadow-card:0 22px 50px -20px rgba(18,41,31,.35);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--ink);
  background:var(--cream);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.font-display{
  font-family:'Nunito',system-ui,sans-serif;
  font-weight:800;
  line-height:1.12;
  margin:0;
  color:var(--forest-deep);
}
p{margin:0;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(246,244,236,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:84px;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-mark{
  width:54px;height:54px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .3s ease;
}
.logo:hover .logo-mark{transform:rotate(-4deg) scale(1.06);}
.logo-mark img{width:100%;height:100%;object-fit:contain;}
.logo-text{display:flex;flex-direction:column;line-height:1.02;}
.logo-text .kalidad{font-family:'Playfair Display',serif;font-weight:800;font-size:1.32rem;letter-spacing:.01em;color:#006837;text-transform:uppercase;}
.logo-text .pharmacy{font-family:'Playfair Display',serif;font-weight:800;font-size:1.18rem;color:#8CC63F;margin-top:-3px;}
.logo-text .tag{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:.62rem;color:#006837;margin-top:3px;opacity:.9;}

nav.main-nav{display:flex;align-items:center;gap:4px;}
nav.main-nav a.nav-link{
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--forest);
  transition:background .2s ease,color .2s ease;
}
nav.main-nav a.nav-link:hover,nav.main-nav a.nav-link.active{background:var(--accent-bg);color:var(--accent-fg);}
.open-badge{
  display:inline-flex;align-items:center;gap:6px;background:var(--accent-bg);color:var(--accent-fg);
  font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  padding:7px 12px;border-radius:999px;margin-left:6px;
}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--forest);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(1.3);}}
.btn{
  display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;
  padding:12px 22px;border-radius:999px;border:2px solid transparent;cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}
.btn:hover{transform:translateY(-1px) scale(1.02);}
.btn-primary{background:var(--forest);color:#fff;box-shadow:var(--shadow-soft);}
.btn-primary:hover{box-shadow:0 16px 30px -12px rgba(18,41,31,.45);}
.btn-outline{border-color:var(--forest);color:var(--forest);background:transparent;}
.btn-outline:hover{background:var(--accent-bg);}
.btn svg{width:18px;height:18px;flex-shrink:0;}
.nav-cta{margin-left:8px;}

.menu-toggle{
  display:none;width:46px;height:46px;border-radius:12px;border:1.5px solid var(--forest);
  background:transparent;color:var(--forest);align-items:center;justify-content:center;cursor:pointer;
}
.mobile-menu{display:none;flex-direction:column;gap:4px;padding:12px 24px 20px;border-top:1px solid var(--line);}
.mobile-menu a{padding:12px 8px;border-radius:10px;font-weight:600;}
.mobile-menu a:hover,.mobile-menu a.active{background:var(--accent-bg);}
.mobile-menu.open{display:flex;}

@media (max-width:900px){
  nav.main-nav{display:none;}
  .menu-toggle{display:flex;}
}

/* ---------- page header banner (non-home pages) ---------- */
.page-banner{
  position:relative;overflow:hidden;padding:56px 0 64px;
  background:linear-gradient(155deg,var(--forest) 0%,var(--forest-deep) 100%);color:#fff;
}
.page-banner .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none;background:var(--lime);width:300px;height:300px;top:-120px;right:-80px;}
.page-banner .kicker{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--lime);}
.page-banner h1{color:#fff;margin-top:10px;font-size:clamp(2rem,4vw,2.7rem);}
.page-banner p{margin-top:12px;max-width:520px;opacity:.85;}
.breadcrumb{display:flex;gap:8px;align-items:center;font-size:.82rem;opacity:.75;margin-bottom:16px;}
.breadcrumb a:hover{text-decoration:underline;}

/* ---------- hero (home) ---------- */
.hero{position:relative;overflow:hidden;padding:64px 0 100px;}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none;}
.blob-1{width:340px;height:340px;background:var(--lime);top:-120px;left:-120px;}
.blob-2{width:380px;height:380px;background:var(--forest-mid);bottom:-160px;right:-100px;opacity:.35;}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;}
@media (max-width:940px){.hero-grid{grid-template-columns:1fr;}}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;background:var(--accent-bg);color:var(--accent-fg);
  font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;
  padding:8px 16px;border-radius:999px;
}
.eyebrow .pulse-dot{background:var(--forest-mid);}
.hero h1{font-size:clamp(2.1rem,4vw,3.1rem);margin-top:20px;}
.hero h1 .accent{color:var(--lime-deep);position:relative;}
.hero p.lede{margin-top:18px;max-width:480px;color:var(--muted);font-size:1.08rem;}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;}

.hero-visual{position:relative;}
.slider{position:relative;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card);aspect-ratio:4/3;background:var(--forest-deep);}
.slide{position:absolute;inset:0;opacity:0;transform:scale(1.04);transition:opacity 1s ease,transform 1.2s ease;display:flex;flex-direction:column;justify-content:flex-end;padding:32px;color:#fff;}
.slide.active{opacity:1;transform:scale(1);}
.slide .slide-icon{
  position:absolute;top:28px;right:28px;width:78px;height:78px;border-radius:22px;
  background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
.slide .slide-icon svg{width:38px;height:38px;color:#fff;}
.slide-tag{align-self:flex-start;background:var(--lime);color:var(--forest-deep);font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:6px 12px;border-radius:999px;margin-bottom:14px;}
.slide h2{color:#fff;font-size:1.6rem;}
.slide p{margin-top:6px;max-width:320px;font-size:.9rem;opacity:.92;}
.slide-bg-1{background:radial-gradient(circle at 25% 20%,#2C6B4F 0%,#12291F 75%);}
.slide-bg-2{background:radial-gradient(circle at 75% 25%,#3E7A57 0%,#12291F 75%);}
.slide-bg-3{background:radial-gradient(circle at 30% 75%,#316049 0%,#12291F 75%);}
.slide-bg-4{background:radial-gradient(circle at 70% 70%,#457C5C 0%,#12291F 75%);}

.slider-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);color:var(--forest-deep);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s ease,background .2s ease;}
.slider:hover .slider-nav{opacity:1;}
.slider-nav:hover{background:#fff;}
.slider-nav.prev{left:14px;}
.slider-nav.next{right:14px;}
.slider-dots{position:absolute;top:20px;right:20px;display:flex;gap:6px;z-index:2;}
.slider-dots button{height:6px;border-radius:999px;border:none;background:rgba(255,255,255,.45);cursor:pointer;transition:all .4s ease;width:12px;}
.slider-dots button.active{width:26px;background:var(--lime);}

.info-card{
  background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow-soft);
  display:grid;gap:16px;margin-top:24px;
}
@media(min-width:940px){.info-card{position:absolute;bottom:-30px;right:-16px;max-width:290px;margin-top:0;}}
.info-row{display:flex;gap:12px;align-items:flex-start;}
.info-row .icon{
  width:40px;height:40px;border-radius:12px;background:var(--accent-bg);color:var(--forest);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.info-row .icon svg{width:19px;height:19px;}
.info-row .label{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.info-row .value{font-size:.88rem;font-weight:700;margin-top:2px;color:var(--forest-deep);}

/* ---------- section heading ---------- */
.section{padding:88px 0;}
.section.tight{padding:64px 0;}
.section-head{max-width:600px;margin:0 auto 48px;text-align:center;}
.section-head.left{margin:0 0 40px;text-align:left;}
.section-head .kicker{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--forest-mid);}
.section-head h2{margin-top:10px;font-size:clamp(1.7rem,3vw,2.3rem);}
.section-head p{margin-top:12px;color:var(--muted);}
.leaf-rule{width:60px;height:5px;border-radius:999px;background:var(--lime);margin:18px auto 0;}
.section-head.left .leaf-rule{margin:18px 0 0;}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;}
.reveal.in{opacity:1;transform:none;}

/* ---------- services ---------- */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:920px){.services-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){.services-grid{grid-template-columns:1fr;}}
.service-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:26px;
  transition:transform .25s ease,box-shadow .25s ease;
}
.service-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-soft);}
.service-tag{display:inline-block;background:var(--accent-bg);color:var(--accent-fg);font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:5px 12px;border-radius:999px;}
.service-card h3{margin-top:16px;font-size:1.15rem;}
.service-card p{margin-top:8px;font-size:.9rem;color:var(--muted);}
.service-card.detailed{padding:30px;}
.service-card.detailed .service-icon{width:52px;height:52px;border-radius:16px;background:var(--accent-bg);color:var(--forest);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.service-card.detailed .service-icon svg{width:26px;height:26px;}
.service-card.detailed ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px;}
.service-card.detailed li{display:flex;gap:8px;font-size:.85rem;color:var(--ink);align-items:flex-start;}
.service-card.detailed li svg{width:16px;height:16px;color:var(--forest-mid);flex-shrink:0;margin-top:3px;}
.explore-wrap{text-align:center;margin-top:40px;}

/* ---------- stats band ---------- */
.stats-band{background:linear-gradient(155deg,var(--forest) 0%,var(--forest-deep) 100%);color:#fff;padding:60px 0;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;text-align:center;}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr;gap:28px;}}
.stat-num{font-family:'Nunito';font-weight:900;font-size:2.6rem;color:var(--lime);}
.stat-label{margin-top:8px;font-size:.9rem;opacity:.85;max-width:14rem;margin-left:auto;margin-right:auto;}

/* ---------- features ---------- */
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:820px){.features-grid{grid-template-columns:1fr;}}
.feature-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:28px;transition:transform .25s ease,box-shadow .25s ease;}
.feature-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-soft);}
.feature-icon{width:52px;height:52px;border-radius:16px;background:var(--accent-bg);color:var(--forest);display:flex;align-items:center;justify-content:center;}
.feature-icon svg{width:26px;height:26px;}
.feature-card h3{margin-top:16px;font-size:1.05rem;}
.feature-card p{margin-top:8px;font-size:.88rem;color:var(--muted);}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;}
@media(max-width:880px){.about-grid{grid-template-columns:1fr;}}
.about-copy p{color:var(--muted);margin-top:14px;font-size:1rem;}
.about-copy .kicker{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--forest-mid);}
.about-copy h2{margin-top:10px;font-size:clamp(1.7rem,3vw,2.2rem);}
.about-list{margin-top:22px;display:grid;gap:12px;}
.about-list li{display:flex;gap:10px;align-items:flex-start;list-style:none;font-size:.92rem;color:var(--ink);}
.about-list svg{width:20px;height:20px;color:var(--forest-mid);flex-shrink:0;margin-top:2px;}
.about-visual{background:linear-gradient(155deg,var(--forest-mid) 0%,var(--forest-deep) 100%);border-radius:var(--radius-lg);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:var(--shadow-card);}
.about-visual svg{width:46%;height:46%;color:var(--lime);opacity:.92;}
.about-visual::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(199,239,62,.25),transparent 55%);}

/* ---------- team / values ---------- */
.values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:820px){.values-grid{grid-template-columns:1fr;}}
.value-card{text-align:center;padding:8px;}
.value-card .feature-icon{margin:0 auto;}
.value-card h3{margin-top:16px;font-size:1.05rem;}
.value-card p{margin-top:8px;font-size:.88rem;color:var(--muted);}

.timeline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:10px;}
.timeline-item{position:relative;padding:0 0 34px 30px;}
.timeline-item:last-child{padding-bottom:0;}
.timeline-item::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--lime);border:3px solid var(--forest-deep);}
.timeline-item .year{font-size:.75rem;font-weight:800;color:var(--forest-mid);text-transform:uppercase;letter-spacing:.08em;}
.timeline-item h4{margin-top:4px;font-size:1.05rem;color:var(--forest-deep);font-family:'Nunito';font-weight:800;}
.timeline-item p{margin-top:6px;font-size:.88rem;color:var(--muted);}

/* ---------- contact ---------- */
.contact-wrap{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);overflow:hidden;display:grid;grid-template-columns:1fr 1fr;}
@media(max-width:880px){.contact-wrap{grid-template-columns:1fr;}}
.contact-info{padding:44px;background:linear-gradient(155deg,var(--forest) 0%,var(--forest-deep) 100%);color:#fff;}
.contact-info h3{color:#fff;font-size:1.4rem;}
.contact-info p.sub{margin-top:8px;opacity:.85;font-size:.92rem;}
.contact-info .info-row{margin-top:22px;}
.contact-info .info-row .icon{background:rgba(255,255,255,.14);color:var(--lime);}
.contact-info .info-row .label{color:rgba(255,255,255,.65);}
.contact-info .info-row .value{color:#fff;}
.contact-form{padding:44px;display:grid;gap:16px;}
.contact-form label{font-size:.8rem;font-weight:700;color:var(--forest-deep);display:block;margin-bottom:6px;}
.contact-form input,.contact-form textarea,.contact-form select{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:.92rem;
  background:var(--cream);transition:border-color .2s ease;
}
.contact-form input:focus,.contact-form textarea:focus,.contact-form select:focus{outline:none;border-color:var(--forest-mid);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.form-row{grid-template-columns:1fr;}}
.form-note{font-size:.78rem;color:var(--muted);margin-top:-4px;}

.map-card{margin-top:32px;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-soft);}
.map-visual{
  aspect-ratio:16/6;background:
    linear-gradient(155deg,var(--forest-mid) 0%,var(--forest-deep) 100%);
  display:flex;align-items:center;justify-content:center;position:relative;color:#fff;
}
.map-visual::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px);
  background-size:22px 22px;}
.map-pin{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;}
.map-pin svg{width:44px;height:44px;color:var(--lime);}
.map-pin span{font-weight:700;font-size:.92rem;background:rgba(0,0,0,.25);padding:6px 14px;border-radius:999px;}

.faq{display:grid;gap:14px;max-width:760px;margin:0 auto;}
.faq-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px;}
.faq-item summary{cursor:pointer;font-weight:700;color:var(--forest-deep);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.faq-item summary::-webkit-details-marker{display:none;}
.faq-item summary .chev{transition:transform .25s ease;flex-shrink:0;}
.faq-item[open] summary .chev{transform:rotate(180deg);}
.faq-item p{margin-top:12px;color:var(--muted);font-size:.92rem;}

/* ---------- footer ---------- */
footer{background:linear-gradient(155deg,var(--forest) 0%,var(--forest-deep) 100%);color:#fff;margin-top:0;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;padding:64px 0 50px;}
@media(max-width:760px){.footer-grid{grid-template-columns:1fr;gap:32px;}}
.footer-grid h4{color:#fff;font-size:1.5rem;}
.footer-grid p.desc{margin-top:10px;opacity:.85;max-width:22rem;font-size:.92rem;}
.footer-col p.head{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;opacity:.65;}
.footer-col ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;font-size:.9rem;}
.footer-col ul a{opacity:.88;}
.footer-col ul a:hover{opacity:1;text-decoration:underline;}
.footer-contact li{display:flex;gap:8px;font-size:.88rem;opacity:.88;align-items:flex-start;}
.footer-contact svg{width:16px;height:16px;margin-top:2px;flex-shrink:0;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.15);}
.footer-bottom .container{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:20px 24px;font-size:.78rem;opacity:.8;}

/* whatsapp floating button (mobile convenience) */
.wa-float{
  position:fixed;bottom:22px;right:22px;z-index:60;background:var(--forest);color:#fff;
  width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 30px -10px rgba(18,41,31,.55);
}
.wa-float i{font-size:26px;}
@media(min-width:900px){.wa-float{display:none;}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  html{scroll-behavior:auto;}
}


/* Global typography override */
html, body, body *,
button, input, textarea, select {
  font-family: 'Playfair Display', serif !important;
}

/* ===== Reference hero redesign ===== */
.page-banner{
  position:relative;
  min-height:645px;
  padding:0;
  overflow:hidden;
  display:flex;
  align-items:stretch;
  color:var(--forest-deep);
  background:linear-gradient(108deg,#376c59 0%,#6e9183 34%,#d9e3dc 62%,#ffffff 82%,#ffffff 100%);
}
.page-banner::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 28% 42%,rgba(255,255,255,.10),transparent 32%);
  pointer-events:none;
}
.page-banner .blob{display:none;}
.page-banner .container{
  position:relative;
  z-index:2;
  width:100%;
  max-width:1180px;
  padding:0 24px;
  display:grid;

<script id="kalidad-uniform-mobile-navigation">
(function () {
    const toggle = document.getElementById('menuToggle');
    const menu = document.getElementById('mobileMenu');
    if (!toggle || !menu) return;

    function setOpen(open) {
        toggle.setAttribute('aria-expanded', String(open));
        menu.classList.toggle('open', open);
    }

    toggle.addEventListener('click', function () {
        const open = toggle.getAttribute('aria-expanded') === 'true';
        setOpen(!open);
    });

    menu.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
            setOpen(false);
        });
    });

    window.addEventListener('resize', function () {
        if (window.innerWidth > 900) setOpen(false);
    }, { passive: true });

    setOpen(false);
})();
</script>

<script id="kalidad-shared-header-behavior">

(function(){
    const header = document.querySelector('header');
    const hero = document.querySelector('.page-banner, .hero, .hero-reframed, .career-hero');
    if(!header) return;
    function update(){
        const y = window.scrollY || window.pageYOffset;
        header.classList.toggle('is-scrolled', y > 24);
        if(hero){
            const bottom = hero.getBoundingClientRect().bottom;
            header.classList.toggle('logo-hidden', bottom <= 90);
        }
    }
    let ticking = false;
    window.addEventListener('scroll', function(){
        if(!ticking){
            requestAnimationFrame(function(){ update(); ticking=false; });
            ticking=true;
        }
    }, {passive:true});
    window.addEventListener('resize', update, {passive:true});
    update();
})();

</script>

<script id="contact-hero-logo-scroll">
(function () {
    const header = document.querySelector('header');
    const hero = document.querySelector('.page-banner');
    if (!header || !hero) return;

    const updateHeader = () => {
        const heroBottom = hero.getBoundingClientRect().bottom;
        header.classList.toggle('is-scrolled', window.scrollY > 24);
        header.classList.toggle('logo-hidden', heroBottom <= 90);
    };

    let ticking = false;
    const onScroll = () => {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(() => {
            updateHeader();
            ticking = false;
        });
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', updateHeader, { passive: true });
    updateHeader();
})();
</script>
