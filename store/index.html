<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Pharmacy</a><div class="nav-actions"><a class="pill alt optional" href="../index.html">Main site</a><a class="pill alt" href="account.html">Account</a><a class="pill" href="cart.html">Cart (<span id="cartCount">0</span>)</a></div></nav><section class="hero"><h1>Your health, delivered.</h1><p>Explore health, wellness, personal care and everyday pharmacy essentials from Kalidad Pharmacy.</p></section><div class="toolbar"><input id="search" placeholder="Search products..."><select id="category"><option value="">All categories</option></select></div><main id="products" class="grid"><p>Loading products...</p></main></div><script type="module">import{getProducts,getCategories,productCard}from'../js/products.js';import{addToCart,bindCartCount}from'../js/cart.js';const root=document.querySelector('#products'),search=document.querySelector('#search'),cat=document.querySelector('#category');let all=[];function render(){const q=search.value.toLowerCase(),c=cat.value;const list=all.filter(p=>(!q||`${p.name} ${p.description||''}`.toLowerCase().includes(q))&&(!c||p.categoryId===c));root.innerHTML=list.length?list.map(productCard).join(''):'<div class="empty">No products found.</div>';root.querySelectorAll('.add-cart').forEach(b=>b.onclick=async()=>{const p=all.find(x=>x.id===b.dataset.productId);addToCart(p);b.textContent='Added ✓';setTimeout(()=>b.textContent='Add to cart',900)})}search.oninput=render;cat.onchange=render;bindCartCount(document.querySelector('#cartCount'));try{[all]=await Promise.all([getProducts(),getCategories().then(cs=>{cs.forEach(c=>cat.insertAdjacentHTML('beforeend',`<option value="${c.id}">${c.name}</option>`))})]);render()}catch(e){root.innerHTML='<div class="empty">The store could not load products yet. Please try again shortly.</div>';console.error(e)}</script></body></html>
