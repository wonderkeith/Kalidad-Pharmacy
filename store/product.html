<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Pharmacy</a><div class="nav-actions"><a class="pill" href="cart.html">Cart (<span id="cartCount">0</span>)</a></div></nav><main id="product" class="panel">Loading product...</main></div><script type="module">import{getProduct,money,escapeHtml}from'../js/products.js';import{addToCart,bindCartCount}from'../js/cart.js';bindCartCount(document.querySelector('#cartCount'));const id=new URLSearchParams(location.search).get('id'),root=document.querySelector('#product');try{const p=await getProduct(id);if(!p){root.innerHTML='<div class="empty">Product not found.</div>'}else{const image=p.image||(p.images?.[0]||'');root.innerHTML=`<div style="display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);gap:35px;align-items:center"><div class="product-image" style="border-radius:18px;overflow:hidden"><img src="${escapeHtml(image)}" alt="${escapeHtml(p.name)}"></div><div><span class="product-category">${escapeHtml(p.categoryName||'Health & wellness')}</span><h1>${escapeHtml(p.name)}</h1><h2 style="color:var(--forest)">${money(p.salePrice??p.price)}</h2><p>${escapeHtml(p.description||p.shortDescription||'')}</p><p>${p.requiresPrescription?'<strong>Prescription required.</strong> Please contact the pharmacy before ordering this item.':'Available for online ordering.'}</p><button class="pill" id="add">Add to cart</button></div></div>`;document.querySelector('#add').onclick=()=>{addToCart(p);location.href='cart.html'}}}catch(e){root.innerHTML='<div class="empty">Unable to load this product.</div>';console.error(e)}</script></body></html>
