<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Pharmacy</a><div class="nav-actions"><a class="pill alt" href="orders.html">My orders</a><button class="pill" id="logout">Log out</button></div></nav><main class="panel"><h1>My account</h1><div id="profile">Loading...</div></main></div><script type="module">import{auth}from'../js/firebase-config.js';import{watchAuth,getUserProfile,logout}from'../js/auth.js';watchAuth(async u=>{if(!u){location.href='login.html';return}const p=await getUserProfile(u.uid);document.querySelector('#profile').innerHTML=`<p><strong>Name:</strong> ${p?.firstName||''} ${p?.lastName||''}</p><p><strong>Email:</strong> ${u.email||''}</p><p><strong>Phone:</strong> ${p?.phone||'Not set'}</p><a class="pill" href="orders.html">View my orders</a>`});document.querySelector('#logout').onclick=async()=>{await logout();location.href='login.html'};</script></body></html>
