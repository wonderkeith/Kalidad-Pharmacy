<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"><style>.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.account-card{display:block;text-decoration:none}.account-card strong{display:block;font-size:1.35rem;color:#12291F;margin-top:6px}.account-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:700px){.account-grid{grid-template-columns:1fr}}</style></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="../index.html">Kalidad Pharmacy</a><div class="nav-actions"><a class="pill alt" href="../index.html">Back to Home</a><a class="pill alt" href="orders.html">My Orders</a><button class="pill" id="logout">Log out</button></div></nav><main><section class="hero"><h1>My account</h1><p id="welcome">Loading your account...</p></section><section class="account-grid"><a class="panel account-card" href="orders.html"><span>Orders</span><strong id="orderCount">—</strong><small>View your order history and status</small></a><a class="panel account-card" href="cart.html"><span>Shopping cart</span><strong id="cartCount">0</strong><small>Review items before checkout</small></a><div class="panel account-card"><span>Account status</span><strong>Active</strong><small>Your Kalidad Pharmacy customer account</small></div></section><section class="panel" style="margin-top:20px"><h2>Profile</h2><div id="profile" style="margin-top:14px">Loading...</div></section></main></div><script type="module">import{watchAuth,getUserProfile,logout}from'../js/auth.js';import{getMyOrders}from'../js/orders.js';const welcome=document.querySelector('#welcome'),profile=document.querySelector('#profile');watchAuth(async u=>{if(!u){location.href='login.html';return}try{const p=await getUserProfile(u.uid);welcome.textContent=`Welcome back, ${p?.firstName||u.displayName||'Customer'}.`;profile.innerHTML=`<p><strong>Name:</strong> ${p?.firstName||''} ${p?.lastName||''}</p><p><strong>Email:</strong> ${u.email||''}</p><p><strong>Phone:</strong> ${p?.phone||'Not set'}</p><p><strong>Account:</strong> Customer</p>`;const orders=await getMyOrders();document.querySelector('#orderCount').textContent=orders.length;document.querySelector('#cartCount').textContent=(JSON.parse(localStorage.getItem('kalidad_cart')||'[]')).reduce((n,x)=>n+Number(x.quantity||0),0)}catch(e){profile.innerHTML='<p>Unable to load your profile right now.</p>';console.error(e)}});document.querySelector('#logout').onclick=async()=>{await logout();location.href='login.html'};</script></body></html>
