<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell" style="max-width:560px;padding-top:6vh"><main class="panel"><p class="brand">Kalidad Pharmacy</p><h1>Create your account</h1><form id="signupForm" class="form"><div class="row"><label>First name<input id="firstName" required autocomplete="given-name"></label><label>Last name<input id="lastName" required autocomplete="family-name"></label></div><label>Phone number<input id="phone" type="tel" required autocomplete="tel" placeholder="+256..."></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="new-password"></label><label>Confirm password<input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password"></label><button class="pill" type="submit">Create account</button><p id="message" aria-live="polite"></p></form><p>Already have an account? <a href="login.html">Log in</a></p></main></div><script type="module">import{registerCustomer}from'../js/auth.js';const form=document.querySelector('#signupForm'),message=document.querySelector('#message');form.onsubmit=async e=>{e.preventDefault();const firstName=document.querySelector('#firstName').value,lastName=document.querySelector('#lastName').value,phone=document.querySelector('#phone').value,email=document.querySelector('#email').value,password=document.querySelector('#password').value,confirm=document.querySelector('#confirmPassword').value;if(password!==confirm){message.textContent='Passwords do not match.';message.className='error';return}message.textContent='Creating your account...';try{await registerCustomer({firstName,lastName,phone,email,password});location.href='index.html'}catch(err){message.textContent=err.code==='auth/email-already-in-use'?'An account with this email already exists.':err.message;message.className='error'}};</script></body></html>
