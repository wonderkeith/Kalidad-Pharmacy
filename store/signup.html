<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Kalidad Pharmacy</title>
  <style>
    :root{--forest:#1E4F3B;--deep:#12291F;--lime:#C7EF3E;--cream:#F6F4EC;--line:#dfe4dc}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:#16241d;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(480px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 20px 60px #12291f22}.brand{text-align:center;margin-bottom:24px}.brand h1{margin:0;color:var(--forest);font-size:28px}.brand p{margin:6px 0;color:#647166}
    form{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:700;display:grid;gap:7px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit}input:focus{outline:2px solid var(--lime);border-color:var(--forest)}button{border:0;border-radius:999px;padding:14px;background:var(--forest);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.message{min-height:20px;text-align:center;font-size:14px}.links{text-align:center;margin-top:18px;font-size:14px}.links a{color:var(--forest);font-weight:700;text-decoration:none}@media(max-width:500px){.row{grid-template-columns:1fr}.card{padding:24px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><h1>Kalidad Pharmacy</h1><p>Create your customer account</p></div>
    <form id="signupForm">
      <div class="row"><label>First name<input id="firstName" required autocomplete="given-name"></label><label>Last name<input id="lastName" required autocomplete="family-name"></label></div>
      <label>Phone number<input id="phone" type="tel" required autocomplete="tel" placeholder="+256..."></label>
      <label>Email<input id="email" type="email" required autocomplete="email"></label>
      <label>Password<input id="password" type="password" required minlength="6" autocomplete="new-password"></label>
      <label>Confirm password<input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password"></label>
      <button type="submit">Create account</button>
      <div class="message" id="message" aria-live="polite"></div>
    </form>
    <div class="links">Already have an account? <a href="login.html">Log in</a></div>
  </main>
  <script type="module">
    import { registerCustomer } from "../js/auth.js";
    const form=document.getElementById('signupForm'), message=document.getElementById('message');
    form.addEventListener('submit',async(e)=>{e.preventDefault();message.textContent='Creating your account...';
      const password=document.getElementById('password').value, confirm=document.getElementById('confirmPassword').value;
      if(password!==confirm){message.textContent='Passwords do not match.';return;}
      try{await registerCustomer({firstName:firstName.value,lastName:lastName.value,phone:phone.value,email:email.value,password});window.location.href='index.html';}
      catch(error){console.error(error);message.textContent=error.code==='auth/email-already-in-use'?'An account with this email already exists.':error.message||'Unable to create account.';}
    });
  </script>
</body>
</html>
