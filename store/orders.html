<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Pharmacy</a><a class="pill" href="index.html">Shop</a></nav><h1>My orders</h1><main id="orders"><p>Loading...</p></main></div><script type="module">import{watchAuth}from'../js/auth.js';import{getMyOrders}from'../js/orders.js';import{money,escapeHtml}from'../js/products.js';watchAuth(async u=>{if(!u){location.href='login.html';return}const root=document.querySelector('#orders');try{const os=await getMyOrders();root.innerHTML=os.length?os.map(o=>`<article class="panel" style="margin-bottom:15px"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${escapeHtml(o.orderNumber||o.id)}</strong><span class="status">${escapeHtml(o.orderStatus||'pending')}</span></div><p>${o.items?.length||0} item(s) · ${money(o.total)}</p><small>${o.createdAt?.toDate?o.createdAt.toDate().toLocaleString():''}</small></article>`).join(''):'<div class="empty">You have no orders yet. <a class="pill" href="index.html">Start shopping</a></div>'}catch(e){root.innerHTML='<div class="empty">Unable to load orders.</div>';console.error(e)}});</script></body></html>
