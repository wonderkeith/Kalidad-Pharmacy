<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Pharmacy</a><a class="pill" href="checkout.html">Checkout</a></nav><h1>Your cart</h1><main id="cart"></main></div><script type="module">import{getCart,updateQuantity,removeFromCart,cartTotal}from'../js/cart.js';import{money}from'../js/products.js';const root=document.querySelector('#cart');function render(){const c=getCart();if(!c.length){root.innerHTML='<div class="empty"><h2>Your cart is empty</h2><a class="pill" href="index.html">Continue shopping</a></div>';return}root.innerHTML=`<div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th></th></tr></thead><tbody>${c.map(x=>`<tr><td>${x.name}</td><td><input class="qty" data-id="${x.id}" type="number" min="1" value="${x.quantity}" style="width:75px"></td><td>${money(x.price*x.quantity)}</td><td><button class="remove" data-id="${x.id}">Remove</button></td></tr>`).join('')}</tbody></table></div><h2>Total: ${money(cartTotal())}</h2><a class="pill" href="checkout.html">Proceed to checkout</a></div>`;root.querySelectorAll('.qty').forEach(e=>e.onchange=()=>{updateQuantity(e.dataset.id,e.value);render()});root.querySelectorAll('.remove').forEach(e=>e.onclick=()=>{removeFromCart(e.dataset.id);render()})}window.addEventListener('cartchange',render);render();</script></body></html>
