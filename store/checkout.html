<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell"><nav class="store-nav"><a class="brand" href="index.html">Kalidad Pharmacy</a><a class="pill alt" href="cart.html">Back to cart</a></nav><h1>Checkout</h1><div id="gate"></div><form id="checkout" class="panel form" style="display:none"><label>Full name<input id="name" required></label><label>Phone number<input id="phone" type="tel" required placeholder="+256..."></label><label>Delivery address<textarea id="address" required rows="3" placeholder="Area, street, landmark..."></textarea></label><label>Payment method<select id="payment"><option value="cash_on_delivery">Cash on delivery</option><option value="mobile_money">Mobile money</option></select></label><label>Notes<textarea id="notes" rows="3" placeholder="Optional delivery notes"></textarea></label><div id="summary"></div><button class="pill" type="submit">Place order</button><p id="message" aria-live="polite"></p></form></div><script type="module">import{auth}from'../js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{createOrder}from'../js/orders.js';import{getCart,cartTotal,clearCart}from'../js/cart.js';import{money}from'../js/products.js';const gate=document.querySelector('#gate'),form=document.querySelector('#checkout'),cart=getCart();if(!cart.length)gate.innerHTML='<div class="empty">Your cart is empty. <a class="pill" href="index.html">Shop now</a></div>';onAuthStateChanged(auth,user=>{if(!cart.length)return;if(!user){gate.innerHTML='<div class="notice">Please <a href="login.html">log in</a> to continue checkout.</div>';return}gate.innerHTML='';form.style.display='grid';document.querySelector('#name').value=user.displayName||'';document.querySelector('#summary').innerHTML=`<h2>Order total: ${money(cartTotal())}</h2>`});form.onsubmit=async e=>{e.preventDefault();const msg=document.querySelector('#message');msg.textContent='Placing order...';try{const id=await createOrder({items:cart,deliveryAddress:{name:name.value,phone:phone.value,address:address.value},customerNotes:notes.value,paymentMethod:payment.value});clearCart();location.href=`order-success.html?id=${encodeURIComponent(id)}`}catch(err){msg.textContent=err.message;msg.className='error'}};</script></body></html>
