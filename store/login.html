<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Kalidad Pharmacy</title><link rel="stylesheet" href="../css/store.css"></head><body><div class="store-shell" style="max-width:520px;padding-top:8vh"><main class="panel"><p class="brand">Kalidad Pharmacy</p><h1>Welcome back</h1><p>Sign in to your Kalidad customer account to continue.</p><form id="loginForm" class="form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="pill" type="submit">Sign in</button><button id="reset" type="button" class="pill alt">Forgot password?</button><p id="message" aria-live="polite"></p></form><p>New to Kalidad? <a href="signup.html">Create an account</a></p></main></div><script type="module">import{login,resetPassword}from'../js/auth.js';const form=document.querySelector('#loginForm'),email=document.querySelector('#email'),password=document.querySelector('#password'),message=document.querySelector('#message');form.onsubmit=async e=>{e.preventDefault();message.textContent='Signing in...';message.className='';try{await login(email.value,password.value);message.textContent='Sign-in successful. Taking you to prescription services...';message.className='success';setTimeout(()=>{location.href='../services.html#prescription-filling'},250)}catch(err){message.textContent=err.code==='auth/invalid-credential'?'Incorrect email or password.':err.message;message.className='error'}};document.querySelector('#reset').onclick=async()=>{if(!email.value){message.textContent='Enter your email first.';message.className='error';return}try{await resetPassword(email.value);message.textContent='Password reset email sent.';message.className='success'}catch(err){message.textContent=err.message;message.className='error'}};</script></body></html>
