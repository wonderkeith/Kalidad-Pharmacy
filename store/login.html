<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | Kalidad Pharmacy</title>
<style>:root{--forest:#1E4F3B;--cream:#F6F4EC;--line:#dfe4dc}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 20px 60px #12291f22}h1{text-align:center;color:var(--forest);margin:0}p{text-align:center;color:#647166;margin:8px 0 25px}form{display:grid;gap:14px}label{font-size:13px;font-weight:700;display:grid;gap:7px}input{padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit}button{border:0;border-radius:999px;padding:14px;background:var(--forest);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.message{text-align:center;min-height:20px;font-size:14px}.links{text-align:center;margin-top:18px;font-size:14px}.links a{color:var(--forest);font-weight:700;text-decoration:none}.reset{text-align:right;font-size:13px}.reset a{color:var(--forest)}</style></head>
<body><main class="card"><h1>Welcome back</h1><p>Log in to your Kalidad Pharmacy account</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><div class="reset"><a href="#" id="reset">Forgot password?</a></div><button type="submit">Log in</button><div class="message" id="message" aria-live="polite"></div></form><div class="links">New to Kalidad? <a href="signup.html">Create an account</a></div></main>
<script type="module">import{login,resetPassword}from'../js/auth.js';const form=document.getElementById('loginForm'),message=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Logging in...';try{await login(email.value,password.value);window.location.href='index.html'}catch(error){message.textContent=error.code==='auth/invalid-credential'?'Incorrect email or password.':error.message||'Unable to log in.'}});document.getElementById('reset').addEventListener('click',async e=>{e.preventDefault();if(!email.value){message.textContent='Enter your email first.';return}try{await resetPassword(email.value);message.textContent='Password reset email sent.'}catch(error){message.textContent=error.message||'Unable to send reset email.'}});</script></body></html>
