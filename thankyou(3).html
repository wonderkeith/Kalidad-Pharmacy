<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Submitted | Kalidad Pharmacy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap');

:root {
  --forest: #174f3b;
  --forest-light: #dfece5;
  --lime: #b8df72;
  --muted: #65746c;
  --green: #6fc34b;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: 'Playfair Display', Georgia, serif;
}

body {
  min-height: 100vh;
  color: var(--forest);
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 12% 20%, rgba(23, 79, 59, 0.16), transparent 34%),
    radial-gradient(circle at 88% 78%, rgba(184, 223, 114, 0.16), transparent 32%),
    linear-gradient(125deg,
      #dceae3 0%,
      #f7faf8 34%,
      #ffffff 52%,
      #f8fce9 72%,
      #eef8d9 100%);
  background-attachment: fixed;
}

.thank-you {
  text-align: center;
  width: min(720px, 92%);
  padding: 40px 24px;
}

h1 {
  margin: 0 0 14px;
  font-size: clamp(2rem, 5vw, 3.5rem);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
}

p {
  margin: 0 auto 34px;
  max-width: 600px;
  color: var(--muted);
  font-size: 1.1rem;
  line-height: 1.7;
}

.success-icon {
  width: 112px;
  height: 112px;
  margin: 0 auto;
  filter: drop-shadow(0 0 18px rgba(111, 195, 75, .42));
}

.success-icon svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.ring {
  fill: rgba(255,255,255,.92);
  stroke: var(--green);
  stroke-width: 5;
  filter: drop-shadow(0 0 10px rgba(111,195,75,.65));
}

.check {
  fill: none;
  stroke: #4b9d38;
  stroke-width: 8;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 6px rgba(111,195,75,.55));
}

@media(max-width:560px) {
  .thank-you {
    padding: 30px 18px;
  }

  .success-icon {
    width: 94px;
    height: 94px;
  }
}

.back-button {
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 10;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border: 1px solid rgba(23, 79, 59, 0.22);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  color: var(--forest);
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 0.95rem;
  text-decoration: none;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 6px 20px rgba(23, 79, 59, 0.08);
  transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
}

.back-button:hover {
  transform: translateY(-1px);
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 8px 24px rgba(23, 79, 59, 0.14);
}

.back-button:active {
  transform: translateY(0);
}

.back-arrow {
  font-size: 1.2rem;
  line-height: 1;
}

@media(max-width:560px) {
  .back-button {
    top: 16px;
    left: 16px;
    padding: 9px 13px;
  }
}

</style>
</head>
<body>
<button class="back-button" type="button" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = document.referrer || '/'; }" aria-label="Go back to the previous page">
  <span class="back-arrow" aria-hidden="true">←</span>
  <span>Back</span>
</button>
<main class="thank-you" aria-live="polite">
<h1>Thank you for submitting your application.</h1>
<p>We shall review it and get back to you as soon as possible.</p>
<div class="success-icon" aria-hidden="true">
<svg viewBox="0 0 120 120">
<circle class="ring" cx="60" cy="60" r="48"></circle>
<path class="check" d="M35 61 L52 78 L86 42"></path>
</svg>
</div>
</main>
    <script src="theme.js?v=2" defer></script>
</body>
</html>
