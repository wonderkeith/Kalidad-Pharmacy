<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalidad Pharmacy | Pharmacist Support</title><style>:root{--f:#163427;--c:#f6f4ec;--l:#8cc63f;--line:#dfe5df;--soft:#edf5e8;--muted:#63746d}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--f);font:15px/1.45 system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{background:var(--f);color:#fff;padding:15px 0}.nav{display:flex;justify-content:space-between;align-items:center}.button{border:0;border-radius:999px;padding:10px 15px;background:#fff;color:var(--f);font-weight:700;cursor:pointer}.login{max-width:430px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 16px 40px #0001}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}label{display:block;margin:12px 0 6px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:24px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.panel h2{font-size:17px;margin:0;padding:16px;border-bottom:1px solid var(--line)}.queue{padding:10px;max-height:72vh;overflow:auto}.ticket{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;margin:7px 0;color:var(--f);cursor:pointer}.ticket.active{border-color:var(--l);background:var(--soft)}.ticket small{color:var(--muted)}.chat{display:flex;flex-direction:column;height:72vh}.messages{flex:1;overflow:auto;padding:18px}.msg{max-width:78%;margin:8px 0;padding:10px 12px;border-radius:14px;white-space:pre-wrap}.customer{margin-left:auto;background:var(--f);color:#fff}.assistant,.system{background:var(--soft)}.staff{background:#e4eef8}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer textarea{min-height:50px;resize:none}.status{padding:10px 16px;color:var(--muted);border-bottom:1px solid var(--line)}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.queue{max-height:30vh}.chat{height:62vh}.msg{max-width:90%}}</style></head><body><header class="top"><div class="wrap nav"><strong>Kalidad Pharmacy · Pharmacist Support</strong><button id="logout" class="button">Sign out</button></div></header><main class="wrap"><section id="login" class="login"><h1>Pharmacist sign in</h1><p>Use your Kalidad staff/pharmacist Firebase account.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><p><button id="loginBtn" class="button">Sign in</button></p><p id="loginError" style="color:#a33"></p></section><section id="app" class="grid hidden"><section class="panel"><h2>Live queue</h2><div id="queue" class="queue">Loading…</div></section><section class="panel chat"><div class="status" id="status">Select a conversation.</div><div id="messages" class="messages"></div><form id="form" class="composer"><textarea id="body" maxlength="2000" placeholder="Reply as the pharmacist…" disabled></textarea><button class="button" disabled>Send</button></form></section></section></main><script src="/firebase-chat-config.js"></script><script type="module">import{staffLogin,logoutStaff,staffProfile,watchWaitingConversations,watchActiveConversations,watchStaffMessages,watchConversation,sendStaffMessage,updateConversation}from'/firebase-chat.js';const $=s=>document.querySelector(s);let selected=null,unq=null,unm=null,unc=null;function renderQueue(waiting,active){const all=[...waiting,...active.filter(a=>!waiting.some(w=>w.id===a.id))];$('#queue').innerHTML=all.length?all.map(c=>'<button class="ticket '+(selected===c.id?'active':'')+'" data-id="'+c.id+'"><b>Customer</b><br><small>'+c.status+' · '+(c.reason||'pharmacist support')+'</small></button>').join(''):'No active pharmacist conversations.';document.querySelectorAll('.ticket').forEach(b=>b.onclick=()=>select(b.dataset.id))}function renderMessages(list){$('#messages').innerHTML=list.map(m=>'<div class="msg '+m.senderType+'"><b>'+({'staff':'Pharmacist','customer':'Customer','assistant':'AI assistant','system':'System'}[m.senderType]||m.senderType)+'</b><br>'+String(m.body||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>').join('');$('#messages').scrollTop=$('#messages').scrollHeight}async function select(id){selected=id;if(unm)unm();if(unc)unc();$('#body').disabled=false;$('#form button').disabled=false;unm=watchStaffMessages(id,renderMessages);unc=watchConversation(id,c=>$('#status').textContent=c?('Conversation · '+c.status):'Conversation closed')}async function start(){const p=await staffProfile();if(!p)return;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');let w=[],a=[];unq=watchWaitingConversations(x=>{w=x;renderQueue(w,a)});const ua=watchActiveConversations(x=>{a=x;renderQueue(w,a)});window.addEventListener('beforeunload',()=>{if(unq)unq();if(ua)ua()})}$('#loginBtn').onclick=async()=>{try{await staffLogin($('#email').value.trim(),$('#password').value);$('#loginError').textContent='';await start()}catch(e){$('#loginError').textContent=e.message}};$('#logout').onclick=async()=>{await logoutStaff();location.reload()};$('#form').onsubmit=async e=>{e.preventDefault();const t=$('#body').value.trim();if(!t||!selected)return;try{await sendStaffMessage(selected,t);$('#body').value=''}catch(e){alert(e.message)}};start().catch(e=>console.error(e));</script></body></html>
