<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalidad Pharmacy | Pharmacist Live Support</title><style>:root{--forest:#163427;--cream:#f6f4ec;--lime:#8cc63f;--line:#dfe5df;--muted:#63746d;--soft:#edf5e8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--forest);font:15px/1.45 system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{background:var(--forest);color:#fff;padding:15px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.button{border:0;border-radius:999px;padding:10px 15px;background:#fff;color:var(--forest);font:inherit;font-weight:700;cursor:pointer}.login{max-width:430px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 16px 40px #00000012}.login h1{margin-top:0}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}label{display:block;margin:12px 0 6px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:24px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.panel h2{font-size:17px;margin:0;padding:16px;border-bottom:1px solid var(--line)}.queue{padding:10px;max-height:72vh;overflow:auto}.ticket{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;margin:7px 0;color:var(--forest);cursor:pointer}.ticket.active{border-color:var(--lime);background:var(--soft)}.ticket small{color:var(--muted)}.chat{display:flex;flex-direction:column;height:72vh}.messages{flex:1;overflow:auto;padding:18px}.msg{max-width:78%;margin:8px 0;padding:10px 12px;border-radius:14px;white-space:pre-wrap}.customer{margin-left:auto;background:var(--forest);color:#fff}.assistant,.system{background:var(--soft)}.staff{background:#e4eef8}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer textarea{min-height:50px;resize:none}.status{padding:10px 16px;color:var(--muted);border-bottom:1px solid var(--line)}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.queue{max-height:30vh}.chat{height:62vh}.msg{max-width:90%}}</style></head><body><header class="top"><div class="wrap nav"><strong>Kalidad Pharmacy · Pharmacist Support</strong><button id="logout" class="button">Sign out</button></div></header><main class="wrap"><section id="login" class="login"><h1>Pharmacist sign in</h1><p>Use your Kalidad staff/pharmacist account.</p><label>Email or phone</label><input id="identifier" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><p><button id="loginBtn" class="button">Sign in</button></p><p id="loginError" style="color:#a33"></p></section><section id="app" class="grid hidden"><section class="panel"><h2>Live queue</h2><div id="queue" class="queue">Loading…</div></section><section class="panel chat"><div class="status" id="status">Select a conversation.</div><div id="messages" class="messages"></div><form id="form" class="composer"><textarea id="body" maxlength="4000" placeholder="Reply as the pharmacist…" disabled></textarea><button class="button" disabled>Send</button></form></section></section></main><script>let selected=null,lastCount=0;const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function renderMessages(list){$('#messages').innerHTML=list.map(m=>'<div class="msg '+esc(m.sender_type)+'"><b>'+esc(m.sender_type==='staff'?'Pharmacist':m.sender_type)+'</b><br>'+esc(m.body)+'</div>').join('');$('#messages').scrollTop=$('#messages').scrollHeight;lastCount=list.length}async function loadQueue(){try{const d=await api('/api/pharmacist-staff');$('#queue').innerHTML=d.conversations.length?d.conversations.map(c=>'<button class="ticket '+(selected===c.id?'active':'')+'" data-id="'+c.id+'"><b>'+(esc(c.first_name||'Anonymous visitor'))+'</b><br><small>'+esc(c.status)+' · '+esc(c.handoff_reason||'live chat')+'</small></button>').join(''):'No waiting conversations.';document.querySelectorAll('.ticket').forEach(b=>b.onclick=()=>select(b.dataset.id));if(selected)await loadMessages()}catch(e){$('#queue').textContent=e.message}}async function select(id){selected=id;$('#body').disabled=false;$('#form button').disabled=false;await loadMessages();await loadQueue()}async function loadMessages(){if(!selected)return;const d=await api('/api/pharmacist-staff?id='+encodeURIComponent(selected));renderMessages(d.messages);const waiting=d.messages.length?d.messages[d.messages.length-1].sender_type==='customer':true;$('#status').textContent=waiting?'Customer waiting for pharmacist response':'Live pharmacist conversation';}$('#loginBtn').onclick=async()=>{try{const d=await api('/api/pharmacist-login',{method:'POST',body:JSON.stringify({identifier:$('#identifier').value,password:$('#password').value})});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await loadQueue()}catch(e){$('#loginError').textContent=e.message}};$('#logout').onclick=async()=>{await api('/api/pharmacist-login',{method:'DELETE'});location.reload()};$('#form').onsubmit=async e=>{e.preventDefault();const body=$('#body').value.trim();if(!body||!selected)return;try{await api('/api/pharmacist-staff',{method:'POST',body:JSON.stringify({conversationId:selected,body})});$('#body').value='';await loadMessages();await loadQueue()}catch(e){alert(e.message)}};setInterval(()=>{if(!$('#app').classList.contains('hidden'))loadQueue()},2500);</script></body></html>
