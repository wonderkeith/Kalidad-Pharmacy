<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalidad Staff | Digital Care</title><style>:root{--forest:#163427;--cream:#f6f4ec;--line:#dfe5df;--muted:#63746d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--forest);font:16px/1.5 system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}.top{background:var(--forest);color:#fff;padding:16px 0}.nav{display:flex;justify-content:space-between;gap:12px;align-items:center}.button{border:0;border-radius:999px;padding:10px 15px;background:#fff;color:var(--forest);font:inherit;font-weight:700;cursor:pointer;text-decoration:none}main{padding:32px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.ticket{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;margin:8px 0;color:var(--forest);cursor:pointer}.ticket.active{border-color:var(--forest);background:#f2f8ee}.messages{height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px}.message{padding:9px 11px;border-radius:10px;margin:8px 0;background:#f2f8ee;white-space:pre-wrap}.staff{background:#e3edf9}.composer{display:flex;gap:8px;margin-top:10px}textarea{flex:1;min-height:50px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}@media(max-width:720px){.grid{grid-template-columns:1fr}.messages{height:280px}.composer{flex-direction:column}}</style></head><body><header class="top"><div class="wrap nav"><strong>Kalidad Pharmacy · Staff queue</strong><a class="button" href="/">Customer view</a></div></header><main class="wrap"><h1>Digital Care team queue</h1><p id="who" class="muted">Checking staff access…</p><div class="grid"><section class="panel"><h2>Anonymous and customer tickets</h2><div id="tickets">Loading…</div></section><section class="panel"><h2 id="title">Select a ticket</h2><p id="context" class="muted">Anonymous tickets have no contact details. Reply here for the visitor to read in the same browser.</p><div id="messages" class="messages"></div><form id="reply" class="composer"><textarea id="body" maxlength="4000" placeholder="Reply to the visitor" disabled></textarea><button class="button" id="send" disabled>Send reply</button></form></section></div></main><script>const token=localStorage.getItem('kalidad_token');if(!token)location.href='/login.html';const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};let selected=null;const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{...headers,...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};const escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function select(id,label,reason){selected=id;document.querySelector('#title').textContent=label;document.querySelector('#context').textContent=reason?'Handoff reason: '+reason+'. Reply is visible only when the visitor returns with the same browser.':'Customer conversation.';document.querySelector('#body').disabled=false;document.querySelector('#send').disabled=false;const data=await api('/api/staff/conversations/'+id+'/messages');const box=document.querySelector('#messages');box.innerHTML=data.messages.map(m=>'<div class="message '+escape(m.sender_type)+'"><b>'+escape(m.sender_type)+'</b><br>'+escape(m.body)+'</div>').join('');box.scrollTop=box.scrollHeight}async function load(){try{const me=await api('/api/auth/me');if(!['staff','pharmacist','admin'].includes(me.user.role))throw Error('This account does not have staff access.');document.querySelector('#who').textContent='Signed in as '+(me.user.first_name||'')+' · '+me.user.role;const data=await api('/api/staff/conversations');const host=document.querySelector('#tickets');host.innerHTML=data.conversations.length?data.conversations.map(x=>'<button class="ticket '+(selected===x.id?'active':'')+'" data-id="'+x.id+'" data-label="'+escape(x.first_name||'Anonymous visitor')+'" data-reason="'+escape(x.handoff_reason||'')+'"><strong>'+escape(x.first_name||'Anonymous visitor')+'</strong><br><span class="muted">'+escape(x.status)+' · '+escape(x.handoff_reason||x.channel)+'</span></button>').join(''):'No active tickets.';host.querySelectorAll('.ticket').forEach(b=>b.onclick=()=>select(b.dataset.id,b.dataset.label,b.dataset.reason).catch(e=>alert(e.message)))}catch(e){document.querySelector('#who').textContent=e.message}}document.querySelector('#reply').addEventListener('submit',async e=>{e.preventDefault();const body=document.querySelector('#body').value.trim();if(!body||!selected)return;try{await api('/api/staff/conversations/'+selected+'/messages',{method:'POST',body:JSON.stringify({body})});document.querySelector('#body').value='';await select(selected,document.querySelector('#title').textContent,'');load()}catch(err){alert(err.message)}});load();</script><script type="module" src="../../js/site-store-access.js"></script>
</body></html>
