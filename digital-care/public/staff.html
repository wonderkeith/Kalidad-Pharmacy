<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalidad Staff | Digital Care</title><style>:root{--forest:#163427;--green:#006837;--lime:#8CC63F;--cream:#f6f4ec;--line:#dfe5df;--muted:#63746d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--forest);font-family:Georgia,serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{background:var(--forest);color:#fff;padding:18px 0}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:1.2rem;font-weight:800}.btn{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer}.lime{background:var(--lime);color:var(--forest)}main{padding:42px 0}.eyebrow,.badge{display:inline-block;background:#e8f4d8;color:var(--green);padding:6px 11px;border-radius:99px;font-size:.72rem;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.stat strong{display:block;font-size:2rem;margin-top:6px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.list{display:grid;gap:10px}.item{padding:14px;border:1px solid var(--line);border-radius:14px}.muted{color:var(--muted);font-size:.88rem}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}select{padding:8px;border:1px solid var(--line);border-radius:9px}@media(max-width:800px){.stats,.layout{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap nav"><div class="brand">Kalidad Pharmacy · Staff</div><a class="btn lime" href="/">Customer view</a></div></header><main><div class="wrap"><span class="eyebrow">Operations</span><h1>Digital Care workspace</h1><p id="who" class="muted">Checking staff access…</p><section class="stats"><div class="stat"><span class="muted">Open conversations</span><strong id="c">—</strong></div><div class="stat"><span class="muted">Prescription reviews</span><strong id="p">—</strong></div><div class="stat"><span class="muted">Orders today</span><strong id="o">—</strong></div><div class="stat"><span class="muted">Low stock</span><strong id="s">—</strong></div></section><div class="layout"><section class="panel"><h2>Prescription queue</h2><div id="rx">Loading…</div></section><section class="panel"><h2>Recent orders</h2><div id="orders">Loading…</div></section></div><section class="panel" style="margin-top:18px"><h2>Customer conversations</h2><div id="convos">Loading…</div></section></div></main><script>const token=localStorage.getItem('kalidad_token');if(!token)location.href='/login.html';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H,...(o.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const me=await api('/api/auth/me');if(!['staff','pharmacist','admin'].includes(me.user.role))throw Error('This account does not have staff access.');document.getElementById('who').textContent=`Signed in as ${me.user.first_name||''} · ${me.user.role}`;const s=await api('/api/staff/summary');c.textContent=s.openConversations;p.textContent=s.pendingPrescriptions;o.textContent=s.ordersToday;document.getElementById('s').textContent=s.lowStock;const [rx,orders,convos]=await Promise.all([api('/api/staff/prescriptions'),api('/api/staff/orders'),api('/api/staff/conversations')]);document.getElementById('rx').innerHTML=rx.prescriptions.length?rx.prescriptions.map(x=>`<div class="row"><span><b>${x.file_name}</b><br><span class="muted">${x.first_name||''} ${x.last_name||''}</span></span><span><select onchange="review('${x.id}',this.value)"><option value="">Review…</option><option value="approved">Approve</option><option value="rejected">Reject</option><option value="needs_review">Needs review</option></select></span></div>`).join(''):'No pending prescriptions.';document.getElementById('orders').innerHTML=orders.orders.slice(0,30).map(x=>`<div class="row"><span><b>${x.order_number}</b><br><span class="muted">UGX ${Number(x.total_ugx).toLocaleString()}</span></span><select onchange="status('${x.id}',this.value)"><option>${x.status}</option>${['confirmed','preparing','ready','out_for_delivery','collected','delivered','cancelled'].filter(v=>v!==x.status).map(v=>`<option>${v}</option>`).join('')}</select></div>`).join('')||'No orders.';document.getElementById('convos').innerHTML=convos.conversations.map(x=>`<div class="row"><span><b>${x.first_name||'Guest'} ${x.last_name||''}</b><br><span class="muted">${x.status} · ${x.channel}</span></span></div>`).join('')||'No active conversations.'}catch(e){document.getElementById('who').textContent=e.message}}async function review(id,status){if(!status)return;await api('/api/staff/prescriptions/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}async function status(id,status){await api('/api/staff/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}load();</script></body></html>
