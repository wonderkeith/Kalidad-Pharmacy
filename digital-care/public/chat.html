<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacist Care | Kalidad</title><style>:root{--forest:#163427;--green:#006837;--lime:#8CC63F;--cream:#f6f4ec;--line:#dfe5df;--muted:#63746d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--forest);font-family:Georgia,serif}.wrap{width:min(900px,calc(100% - 30px));margin:auto}.top{padding:18px 0;border-bottom:1px solid var(--line);background:#ffffffdf;position:sticky;top:0}.toprow{display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:999px;padding:11px 17px;background:var(--forest);color:#fff;font:inherit;font-weight:800;cursor:pointer}.card{margin:30px 0;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}.head{padding:22px;border-bottom:1px solid var(--line)}.messages{height:55vh;overflow:auto;padding:20px;background:#fbfcfa}.msg{max-width:75%;padding:12px 15px;border-radius:17px;margin:10px 0;line-height:1.55}.customer{margin-left:auto;background:var(--forest);color:#fff}.staff,.system{background:#edf5e8}.composer{display:flex;gap:10px;padding:15px;border-top:1px solid var(--line)}textarea{flex:1;resize:none;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:14px;font:inherit}.notice{padding:12px 15px;background:#fff7df;border-bottom:1px solid #eadfb9;color:#5d4b16}.hidden{display:none}@media(max-width:600px){.msg{max-width:90%}.composer{flex-direction:column}.composer .btn{width:100%}}</style></head><body><header class="top"><div class="wrap toprow"><b>Kalidad Pharmacy · Pharmacist Care</b><a class="btn" href="/">Shop</a></div></header><main class="wrap"><div class="card"><div class="head"><h1>Talk to our pharmacy team</h1><p>For medicine suitability, prescriptions, doses, interactions, symptoms or other clinical questions, a pharmacist should review your question.</p></div><div id="notice" class="notice hidden"></div><div id="messages" class="messages"></div><form id="form" class="composer"><textarea id="body" maxlength="4000" placeholder="Type your question…" required></textarea><button class="btn">Send</button></form></div></main><script>const token=localStorage.getItem('kalidad_token');const H=()=>token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'};let conversationId=localStorage.getItem('kalidad_conversation');async function req(url,opt={}){const r=await fetch(url,{...opt,headers:{...H(),...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function start(){if(!conversationId){const d=await req('/api/conversations',{method:'POST'});conversationId=d.conversation.id;localStorage.setItem('kalidad_conversation',conversationId)}await load()}async function load(){try{const d=await req('/api/conversations/'+conversationId+'/messages');document.getElementById('messages').innerHTML=(d.messages||[]).map(m=>`<div class="msg ${m.sender_type==='customer'?'customer':m.sender_type==='system'?'system':'staff'}">${esc(m.body)}</div>`).join('')||'<p>Start the conversation. Please do not share passwords or payment credentials.</p>';const el=document.getElementById('messages');el.scrollTop=el.scrollHeight}catch(e){show(e.message)}}function show(x){const n=document.getElementById('notice');n.textContent=x;n.classList.remove('hidden')}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('body'),body=b.value.trim();if(!body)return;try{await req('/api/conversations/'+conversationId+'/messages',{method:'POST',body:JSON.stringify({body})});b.value='';const safety=await req('/api/conversations/'+conversationId+'/assistant',{method:'POST',body:JSON.stringify({body})});if(safety.message)await load();await load()}catch(x){show(x.message)}};function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}start();setInterval(()=>conversationId&&load(),8000);</script></body></html>
