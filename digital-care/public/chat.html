<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacist Help | Kalidad</title><style>body{margin:0;background:#f6f4ec;color:#163427;font-family:Georgia,serif}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe5df;border-radius:22px;padding:22px}.messages{height:55vh;overflow:auto;border:1px solid #dfe5df;border-radius:15px;padding:15px}.msg{padding:10px 13px;border-radius:14px;background:#edf5e8;margin:8px 0;max-width:80%}.mine{margin-left:auto;background:#163427;color:#fff}textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dfe5df;border-radius:12px;font:inherit;margin-top:12px}.btn{border:0;border-radius:999px;padding:12px 18px;background:#163427;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.muted{color:#63746d}</style></head><body><main class="wrap"><p class="muted">KALIDAD PHARMACY · DIGITAL CARE</p><h1>Talk to our pharmacy team</h1><p class="muted">Ask about products, orders or request pharmacist assistance. Automated guidance does not replace professional review.</p><div class="card"><div id="messages" class="messages"></div><form id="send"><textarea name="body" rows="3" placeholder="Type your message…" required></textarea><button class="btn">Send message</button></form></div><p><a href="/">Back to shop</a> · <a href="/account.html">My account</a></p></main><script>let id=localStorage.getItem('kalidad_conversation');async function start(){if(!id){const r=await fetch('/api/conversations',{method:'POST'});const d=await r.json();id=d.conversation.id;localStorage.setItem('kalidad_conversation',id)}load()}async function load(){const r=await fetch('/api/conversations/'+id+'/messages');const d=await r.json();document.getElementById('messages').innerHTML=(d.messages||[]).map(m=>`<div class="msg ${m.sender_type==='customer'?'mine':''}">${esc(m.body)}</div>`).join('');const el=document.getElementById('messages');el.scrollTop=el.scrollHeight}document.getElementById('send').onsubmit=async e=>{e.preventDefault();const body=new FormData(e.target).get('body');const r=await fetch('/api/conversations/'+id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});if(r.ok){e.target.reset();load()}};function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}start();setInterval(()=>id&&load(),5000);</script></body></html>
