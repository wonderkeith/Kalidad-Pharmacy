<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Kalidad</title><style>body{margin:0;background:#f6f4ec;color:#163427;font-family:Georgia,serif}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe5df;border-radius:20px;padding:24px;margin:18px 0}label{display:block;margin-top:12px;font-weight:700}input,textarea,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dfe5df;border-radius:12px;margin-top:7px;font:inherit}.btn{margin-top:18px;border:0;border-radius:999px;padding:13px 20px;background:#163427;color:#fff;font-weight:800;cursor:pointer}.total{font-size:1.3rem;font-weight:800}.error{color:#a52d2d}.notice{background:#edf5e8;padding:14px;border-radius:12px}</style></head><body><main class="wrap"><p>Kalidad Pharmacy · Digital Care</p><h1>Secure checkout</h1><div class="card"><h2>Your order</h2><div id="items"></div><p class="total">Total: <span id="total">UGX 0</span></p></div><form id="checkout" class="card"><h2>Fulfilment</h2><label>Phone<input name="guestPhone" required autocomplete="tel"></label><label>Email<input name="guestEmail" type="email" autocomplete="email"></label><label>Choose fulfilment<select name="fulfilmentType"><option value="collection">Collection</option><option value="delivery">Delivery</option></select></label><label>Delivery address<textarea name="deliveryAddress" placeholder="Required for delivery"></textarea></label><label>Order note<textarea name="customerNote"></textarea></label><button class="btn">Place order</button><p id="error" class="error"></p><div id="done"></div></form></main><script>const cart=JSON.parse(localStorage.getItem('kalidad_cart')||'[]');const token=localStorage.getItem('kalidad_token');if(!cart.length){document.getElementById('items').textContent='Your cart is empty.';document.querySelector('button').disabled=true}let total=0;document.getElementById('items').innerHTML=cart.map(x=>{total+=x.price*x.quantity;return `<p>${esc(x.name)} × ${x.quantity} — UGX ${(x.price*x.quantity).toLocaleString()}</p>`}).join('');document.getElementById('total').textContent='UGX '+total.toLocaleString();document.querySelector('[name=fulfilmentType]').onchange=e=>document.querySelector('[name=deliveryAddress]').required=e.target.value==='delivery';document.getElementById('checkout').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.items=cart.map(x=>({productId:x.productId,quantity:x.quantity}));try{const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch('/api/orders',{method:'POST',headers,body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);localStorage.removeItem('kalidad_cart');document.getElementById('done').innerHTML=`<div class="notice"><b>Order ${esc(d.order.orderNumber)} created.</b><br>Status: ${esc(d.order.status)}<br>${d.order.status==='awaiting_prescription'?'Please sign in or create an account to upload the prescription.':''}<br><a href="${token?'/account.html':'/login.html'}">${token?'Track your order':'Sign in to track your order'}</a></div>`;e.querySelector('button').disabled=true}catch(x){document.getElementById('error').textContent=x.message}};function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}</script></body></html>
