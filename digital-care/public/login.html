<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Kalidad Digital Care</title><style>body{margin:0;background:#f6f4ec;color:#163427;font-family:Georgia,serif}.wrap{max-width:520px;margin:8vh auto;padding:24px}.card{background:#fff;border:1px solid #dfe5df;border-radius:24px;padding:32px;box-shadow:0 18px 50px #16342712}input{display:block;width:100%;box-sizing:border-box;padding:14px;margin:9px 0 15px;border:1px solid #dfe5df;border-radius:12px;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:#163427;color:#fff;font:inherit;font-weight:800;cursor:pointer}.alt{background:#8CC63F;color:#163427}.muted{color:#63746d}.error{color:#a52d2d;margin:10px 0}.links{display:flex;justify-content:space-between;margin-top:18px}</style></head><body><main class="wrap"><div class="card"><p class="muted">KALIDAD PHARMACY · DIGITAL CARE</p><h1>Welcome back</h1><p class="muted">Sign in to manage your orders, prescriptions and pharmacist conversations.</p><form id="login"><label>Email or phone</label><input name="identifier" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><button class="btn">Sign in</button><p id="error" class="error"></p></form><hr><h2>Create an account</h2><form id="register"><input name="firstName" placeholder="First name" required><input name="lastName" placeholder="Last name"><input name="email" type="email" placeholder="Email"><input name="phone" placeholder="Phone"><input name="password" type="password" minlength="10" placeholder="Password (10+ characters)" required><button class="btn alt">Create account</button></form><div class="links"><a href="/">Back to shop</a><a href="/staff.html">Staff</a></div></div></main><script>const save=d=>{localStorage.setItem('kalidad_token',d.token);localStorage.setItem('kalidad_user',JSON.stringify(d.user));location.href='/account.html'};async function send(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}document.getElementById('login').onsubmit=async e=>{e.preventDefault();document.getElementById('error').textContent='';try{save(await send('/api/auth/login',Object.fromEntries(new FormData(e.target))))}catch(x){document.getElementById('error').textContent=x.message}};document.getElementById('register').onsubmit=async e=>{e.preventDefault();try{save(await send('/api/auth/register',Object.fromEntries(new FormData(e.target))))}catch(x){document.getElementById('error').textContent=x.message}};</script><script type="module" src="../../js/site-store-access.js"></script>
</body></html>
