<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Kalidad</title><style>body{margin:0;background:#f6f4ec;color:#163427;font-family:Georgia,serif}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #dfe5df;border-radius:20px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.badge{display:inline-block;background:#edf5e8;color:#006837;padding:5px 9px;border-radius:99px;font-size:.75rem}.muted{color:#63746d}.btn{border:0;border-radius:999px;padding:11px 16px;background:#163427;color:#fff;font-weight:800;cursor:pointer}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><div class="muted">KALIDAD DIGITAL CARE</div><h1 id="hello">My account</h1></div><button class="btn" onclick="logout()">Sign out</button></div><div class="card"><h2>Orders</h2><div id="orders">Loading…</div></div><div class="card"><h2>Prescription support</h2><p class="muted">Upload a JPG, PNG or PDF for pharmacist review. Prescription documents are stored privately by the service.</p><form id="rx"><input type="file" name="file" accept="image/jpeg,image/png,application/pdf" required><input name="orderId" placeholder="Optional order ID"><button class="btn">Upload prescription</button></form><p id="msg" class="muted"></p></div><div class="card"><h2>Need help?</h2><a class="btn" href="/chat.html">Start a pharmacist conversation</a> <a href="/">Continue shopping</a></div></main><script>const token=localStorage.getItem('kalidad_token');if(!token)location.href='/login.html';const headers={'Authorization':'Bearer '+token};const user=JSON.parse(localStorage.getItem('kalidad_user')||'{}');document.getElementById('hello').textContent=`Hello, ${user.first_name||'customer'}`;async function load(){const r=await fetch('/api/orders',{headers});const d=await r.json();document.getElementById('orders').innerHTML=(d.orders||[]).length?d.orders.map(o=>`<div class="card"><b>${o.order_number}</b> <span class="badge">${o.status}</span><p class="muted">${o.fulfilment_type} · UGX ${Number(o.total_ugx).toLocaleString()}</p></div>`).join(''):'No orders yet.'}load();document.getElementById('rx').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/prescriptions',{method:'POST',headers,body:new FormData(e.target)});const d=await r.json();document.getElementById('msg').textContent=d.error||'Prescription submitted for pharmacist review.'};async function logout(){await fetch('/api/auth/logout',{method:'POST',headers});localStorage.clear();location.href='/';}</script></body></html>
